name: bench

on:
  pull_request:
    paths:
      - "crates/tensor-wasm-bench/**"
      - "crates/*/src/**"
      - ".github/workflows/bench.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # pinned stable rev (was @master)
        with:
          toolchain: nightly-2026-04-03
          components: rustfmt, clippy, rust-src, llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install CUDA stub libraries
        run: |
          sudo mkdir -p /usr/local/cuda/lib64
          sudo touch /usr/local/cuda/lib64/libcuda.so /usr/local/cuda/lib64/libcudart.so
          echo "LD_LIBRARY_PATH=/usr/local/cuda/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "CUDA_ROOT=/usr/local/cuda" >> "$GITHUB_ENV"
      - name: Compile benches
        run: cargo bench --workspace --no-run
      - name: Run benches (short)
        run: |
          mkdir -p bench-results
          cargo bench --workspace -- --output-format bencher --warm-up-time 3 --measurement-time 5 \
            | tee bench-results/current.txt
      - name: Compare against baseline
        if: hashFiles('bench-results/baseline.json') != ''
        # When bench IDs change, update bench-results/baseline.json AND log the
        # rename in bench-results/baseline-notes.md so future bisects can
        # reconcile the parser keys below against the baseline file.
        run: |
          python3 - <<'PY'
          import json, re, sys

          # Criterion --output-format bencher emits one line per metric:
          #   test <bench_id> ... bench:   <median> ns/iter (+/- <stddev>)
          BENCH_LINE = re.compile(
              r"^test\s+(?P<name>\S+)\s+\.\.\.\s+bench:\s+(?P<median>[\d,]+)\s+ns/iter"
          )

          with open("bench-results/baseline.json") as f:
              baseline = json.load(f)
          policy_threshold = baseline["policy"]["regress_pct_threshold"]
          metrics = {m["name"]: m for m in baseline["metrics"]}

          measured = {}
          with open("bench-results/current.txt") as f:
              for line in f:
                  m = BENCH_LINE.match(line.strip())
                  if m:
                      measured[m.group("name")] = int(m.group("median").replace(",", ""))

          print(f"Parsed {len(measured)} metrics from current.txt")
          print(f"Baseline has {len(metrics)} tracked metrics")

          failures = []
          missing = []
          for name, spec in metrics.items():
              # Entries with explicit regression_check=false are listed for
              # visibility / TODO tracking but skipped by the gate -- they
              # carry median_ns=null until a real reading is captured.
              if spec.get("regression_check", True) is False or spec.get("median_ns") is None:
                  print(f"  [SKIP] {name}: regression_check disabled or baseline unset")
                  continue
              if name not in measured:
                  missing.append(name)
                  continue
              cur = measured[name]
              base = spec["median_ns"]
              tol = spec["tolerance_pct"]
              # Allow tolerance + regression threshold combined on top of baseline.
              ceiling = base * (1 + (tol + policy_threshold) / 100.0)
              delta_pct = (cur - base) / base * 100.0
              status = "OK" if cur <= ceiling else "FAIL"
              print(
                  f"  [{status}] {name}: cur={cur} ns, base={base} ns, "
                  f"delta={delta_pct:+.1f}%, ceiling={ceiling:.0f} ns "
                  f"(tol={tol}% + policy={policy_threshold}%)"
              )
              if cur > ceiling:
                  failures.append((name, cur, base, ceiling, delta_pct))

          if missing:
              print(f"::warning::Baseline metrics not found in current run: {missing}")

          if failures:
              print("::error::Performance regressions detected:")
              for name, cur, base, ceiling, delta_pct in failures:
                  print(
                      f"  {name}: {cur} ns > {ceiling:.0f} ns ceiling "
                      f"(baseline {base} ns, delta {delta_pct:+.1f}%)"
                  )
              sys.exit(1)

          print("No regressions beyond per-metric tolerance + policy threshold.")
          PY
      - name: Tail-latency absolute-ceiling gate
        # SEPARATE from the delta-gate above. The delta-gate deliberately
        # ignores P99.9 because tail metrics on shared CI runners are too
        # noisy to gate on per-metric deltas (one slow sample moves P99.9
        # by ~1 ppt of the population). This step is the complementary
        # *catastrophic-blowup* catch: it fails ONLY if any metric's
        # p99_9_ns in bench-results/tail-latency.json exceeds a single,
        # generous, fixed ceiling. It is intentionally NOT a regression
        # check — a 2x tail drift sails right through; it fires only on a
        # qualitative blowup (a deadlock-ish stall, a pathological retry
        # loop, an O(n^2) regression that drags the tail into the
        # milliseconds). Because the ceiling sits ~40x above the worst
        # value ever observed on the noisy dev-host baseline (~250 us for
        # dispatch/concurrent_cap64/100), normal run-to-run jitter on a
        # busy GitHub runner cannot trip it.
        #
        # TUNING: bump TAIL_P99_9_CEILING_NS if a legitimately slower path
        # lands (and update bench-results/README.md). Lower it only with a
        # quiet-host capture in hand — see docs/BENCHMARKING.md. The file is
        # the same sidecar the regression gate ignores, regenerated by the
        # tail_latency bench during the "Run benches (short)" step above.
        if: hashFiles('bench-results/tail-latency.json') != ''
        env:
          # 10 ms. Worst observed p99_9 on the committed noisy-dev-host
          # baseline is ~0.25 ms (dispatch/concurrent_cap64/100), so this
          # leaves ~40x headroom: a generous catastrophic-blowup line, not
          # a regression-delta line. One knob, easy to tune.
          TAIL_P99_9_CEILING_NS: "10000000"
        run: |
          python3 - <<'PY'
          import json, os, sys

          ceiling = int(os.environ["TAIL_P99_9_CEILING_NS"])

          with open("bench-results/tail-latency.json") as f:
              doc = json.load(f)

          metrics = doc.get("metrics", [])
          print(
              f"Tail-latency absolute-ceiling gate: ceiling="
              f"{ceiling} ns ({ceiling / 1_000_000:.1f} ms), "
              f"checking {len(metrics)} metric(s)"
          )

          failures = []
          for m in metrics:
              name = m.get("metric", "<unnamed>")
              backend = m.get("backend", "unified-memory")
              p99_9 = m.get("p99_9_ns")
              if p99_9 is None:
                  # Skipped/placeholder metric (e.g. an unwired backend) —
                  # nothing to gate on.
                  print(f"  [SKIP] {name} ({backend}): no p99_9_ns")
                  continue
              status = "OK" if p99_9 <= ceiling else "FAIL"
              print(
                  f"  [{status}] {name} ({backend}): "
                  f"p99_9={p99_9} ns (ceiling {ceiling} ns)"
              )
              if p99_9 > ceiling:
                  failures.append((name, backend, p99_9))

          if failures:
              print(
                  "::error::Tail-latency p99_9 exceeded the absolute "
                  f"catastrophic-blowup ceiling ({ceiling} ns):"
              )
              for name, backend, p99_9 in failures:
                  print(f"  {name} ({backend}): {p99_9} ns > {ceiling} ns")
              sys.exit(1)

          print("All tail-latency p99_9 values within the absolute ceiling.")
          PY
