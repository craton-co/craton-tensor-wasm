name: audit

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # Daily at 06:17 UTC so newly published RustSec advisories surface
    # even when the repo has not changed.
    - cron: "17 6 * * *"

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        # Fails the job on any advisory (default behaviour). The daily
        # cron picks up new RustSec entries without requiring a commit.
        run: cargo audit --deny warnings

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # Run the full battery (advisories, bans, licenses, sources).
          command: check
