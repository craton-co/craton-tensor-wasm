{{- if not .Values.auth.existingSecret -}}
---
# Bearer-token allowlist. Rendered only when auth.existingSecret is empty;
# users pointing at a pre-existing Secret are responsible for provisioning
# it themselves (kubectl create secret generic <name> --from-literal=...).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tensor-wasm.tokensSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tensor-wasm.labels" . | nindent 4 }}
type: Opaque
stringData:
  TENSOR_WASM_API_TOKENS: {{ .Values.auth.tokens | quote }}
{{- end }}
