[package]
name = "tensor-wasm-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

tensor-wasm-core = { path = "../crates/tensor-wasm-core" }
tensor-wasm-jit = { path = "../crates/tensor-wasm-jit" }
tensor-wasm-snapshot = { path = "../crates/tensor-wasm-snapshot" }
tensor-wasm-wasi-gpu = { path = "../crates/tensor-wasm-wasi-gpu" }
wasmtime = { version = "25", default-features = false, features = ["async", "cranelift", "runtime"] }
tokio = { version = "1.40", features = ["rt", "macros"] }
wat = "1"

[[bin]]
name = "fuzz_wasm_compile"
path = "fuzz_targets/fuzz_wasm_compile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_ptx_emit"
path = "fuzz_targets/fuzz_ptx_emit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_snapshot_restore"
path = "fuzz_targets/fuzz_snapshot_restore.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_wasi_cuda_abi"
path = "fuzz_targets/fuzz_wasi_cuda_abi.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
