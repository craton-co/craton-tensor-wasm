<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Nova — Implementation Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0b;
    --bg2: #111114;
    --bg3: #18181c;
    --bg4: #202026;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --text: #e8e6e0;
    --muted: #7a7870;
    --faint: #3a3834;
    --accent: #e8f060;
    --accent2: #60c4e8;
    --font-display: 'Syne', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;

    --p0: #7a7870; --p0l: #3a3834;
    --p1: #8b6f3a; --p1l: #3d2e14;
    --p2: #3a6b8b; --p2l: #142130;
    --p3: #3a6b50; --p3l: #142214;
    --p4: #6b3a8b; --p4l: #250f30;
    --p5: #8b3a3a; --p5l: #301414;
    --p6: #8b6b3a; --p6l: #302514;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-display);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 28px 40px 24px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .wordmark-icon {
    width: 32px;
    height: 32px;
    background: var(--accent);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .wordmark-icon svg { width: 18px; height: 18px; }

  .wordmark-text {
    font-size: 13px;
    font-family: var(--font-mono);
  }

  .wordmark-title { color: var(--text); font-weight: 500; }
  .wordmark-sub { color: var(--muted); font-size: 11px; margin-top: 1px; }

  .header-stats {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }

  .stat {
    text-align: right;
  }

  .stat-num {
    font-size: 20px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
  }

  .stat-lbl {
    font-size: 11px;
    color: var(--muted);
    font-family: var(--font-mono);
    margin-top: 2px;
  }

  /* ── LAYOUT ── */
  .layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    min-height: calc(100vh - 97px);
  }

  /* ── SIDEBAR ── */
  .sidebar {
    border-right: 1px solid var(--border);
    padding: 24px 0;
    position: sticky;
    top: 97px;
    height: calc(100vh - 97px);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--faint) transparent;
  }

  .sidebar-section {
    padding: 0 16px;
    margin-bottom: 8px;
  }

  .sidebar-label {
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--muted);
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 8px;
    padding: 0 4px;
  }

  .phase-btn {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 8px 10px;
    border: none;
    background: none;
    cursor: pointer;
    border-radius: 6px;
    color: var(--muted);
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 500;
    text-align: left;
    transition: all .15s;
    margin-bottom: 2px;
  }

  .phase-btn:hover { background: var(--bg3); color: var(--text); }

  .phase-btn.active {
    background: var(--bg4);
    color: var(--text);
  }

  .phase-dot {
    width: 8px;
    height: 8px;
    border-radius: 2px;
    flex-shrink: 0;
  }

  .phase-count {
    margin-left: auto;
    font-size: 10px;
    font-family: var(--font-mono);
    background: var(--bg3);
    padding: 1px 5px;
    border-radius: 4px;
  }

  .phase-btn.active .phase-count {
    background: var(--bg);
  }

  .sidebar-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 12px 16px;
  }

  /* ── MAIN ── */
  main {
    padding: 28px 32px;
    overflow-y: auto;
  }

  /* ── PHASE HEADER ── */
  .phase-header {
    margin-bottom: 24px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .phase-title {
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.2;
  }

  .phase-desc {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
    font-family: var(--font-mono);
    max-width: 520px;
  }

  .phase-tag {
    font-size: 10px;
    font-family: var(--font-mono);
    padding: 4px 10px;
    border-radius: 4px;
    letter-spacing: .06em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* ── GRID ── */
  .session-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
    margin-bottom: 32px;
  }

  /* ── SESSION CARD ── */
  .session-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    cursor: pointer;
    transition: border-color .15s, background .15s, transform .1s;
    position: relative;
    overflow: hidden;
  }

  .session-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    opacity: 0;
    transition: opacity .15s;
  }

  .session-card:hover {
    background: var(--bg3);
    border-color: var(--border2);
    transform: translateY(-1px);
  }

  .session-card:hover::before { opacity: 1; }
  .session-card.selected { border-color: var(--border2); background: var(--bg3); }
  .session-card.selected::before { opacity: 1; }

  .card-top {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }

  .session-num {
    font-size: 10px;
    font-family: var(--font-mono);
    font-weight: 500;
    padding: 3px 7px;
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 1px;
    letter-spacing: .04em;
  }

  .card-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.4;
  }

  .card-goal {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.55;
    margin-bottom: 12px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .card-deps {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .dep-chip {
    font-size: 10px;
    font-family: var(--font-mono);
    padding: 2px 6px;
    border-radius: 3px;
    background: var(--bg4);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .card-tasks-count {
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--faint);
  }

  /* ── DETAIL PANEL ── */
  .detail-panel {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 32px;
    animation: slideIn .15s ease-out;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .detail-header {
    padding: 20px 24px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .detail-snum {
    font-size: 11px;
    font-family: var(--font-mono);
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 5px;
    flex-shrink: 0;
    margin-top: 2px;
    letter-spacing: .04em;
  }

  .detail-title-wrap { flex: 1; }

  .detail-title {
    font-size: 16px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.3;
    margin-bottom: 4px;
  }

  .detail-phase-tag {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--muted);
  }

  .detail-close {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .1s;
    flex-shrink: 0;
    font-family: var(--font-display);
  }

  .detail-close:hover { border-color: var(--border2); color: var(--text); background: var(--bg3); }

  .detail-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }

  .detail-col {
    padding: 20px 24px;
  }

  .detail-col:first-child {
    border-right: 1px solid var(--border);
  }

  .detail-section {
    margin-bottom: 20px;
  }

  .detail-section:last-child { margin-bottom: 0; }

  .detail-label {
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--muted);
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .detail-goal-text {
    font-size: 13px;
    color: var(--text);
    line-height: 1.65;
  }

  .task-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .task-list li {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 8px;
    align-items: flex-start;
    line-height: 1.5;
    font-family: var(--font-mono);
  }

  .task-list li::before {
    content: '—';
    color: var(--faint);
    flex-shrink: 0;
    font-size: 11px;
    margin-top: 1px;
  }

  .deliverable-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .deliverable {
    font-size: 11px;
    font-family: var(--font-mono);
    padding: 6px 10px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text);
    line-height: 1.4;
  }

  .done-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .done-list li {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 8px;
    align-items: flex-start;
    line-height: 1.5;
  }

  .done-list li::before {
    content: '✓';
    color: #60c48b;
    font-size: 11px;
    flex-shrink: 0;
    font-weight: 700;
    margin-top: 1px;
  }

  .dep-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .dep-item {
    font-size: 11px;
    font-family: var(--font-mono);
    padding: 5px 9px;
    background: var(--bg4);
    border-radius: 4px;
    color: var(--muted);
  }

  .dep-item span { color: var(--text); }

  /* ── RISK REGISTER ── */
  .risk-section {
    margin-top: 8px;
  }

  .risk-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 12px;
    font-family: var(--font-mono);
    letter-spacing: .04em;
  }

  .risk-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }

  .risk-table th {
    text-align: left;
    font-size: 10px;
    font-family: var(--font-mono);
    color: var(--muted);
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 6px 12px;
    border-bottom: 1px solid var(--border);
  }

  .risk-table td {
    padding: 9px 12px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    line-height: 1.5;
    font-family: var(--font-mono);
  }

  .risk-table td:first-child { color: var(--text); font-weight: 500; }
  .risk-table tr:last-child td { border-bottom: none; }

  .risk-pill {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 3px;
    font-family: var(--font-mono);
    white-space: nowrap;
  }

  .risk-high { background: #3d1414; color: #e87070; }
  .risk-med  { background: #2d2414; color: #e8b060; }
  .risk-low  { background: #142414; color: #70c870; }

  /* ── OVERVIEW SECTION ── */
  .overview-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }

  .overview-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }

  .overview-card-title {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--muted);
    margin-bottom: 10px;
    letter-spacing: .06em;
    text-transform: uppercase;
  }

  .crate-tag {
    display: inline-block;
    font-size: 11px;
    font-family: var(--font-mono);
    padding: 3px 8px;
    background: var(--bg4);
    border: 1px solid var(--border);
    border-radius: 4px;
    margin: 2px;
    color: var(--text);
  }

  .arch-line {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--muted);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .arch-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dep-flow {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--muted);
    line-height: 1.8;
    word-break: break-all;
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 2px; }

  /* ── RESPONSIVE ── */
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
    .detail-body { grid-template-columns: 1fr; }
    .detail-col:first-child { border-right: none; border-bottom: 1px solid var(--border); }
    header { padding: 16px 20px; }
    main { padding: 20px 16px; }
    .overview-grid { grid-template-columns: 1fr; }
    .header-stats { gap: 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="wordmark">
    <div class="wordmark-icon">
      <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
        <polygon points="9,2 16,6 16,12 9,16 2,12 2,6" fill="#0a0a0b" stroke="#0a0a0b" stroke-width="0"/>
        <polygon points="9,2 16,6 16,12 9,16 2,12 2,6" fill="none" stroke="#0a0a0b" stroke-width="1.5"/>
        <circle cx="9" cy="9" r="2.5" fill="#0a0a0b"/>
        <line x1="9" y1="2" x2="9" y2="6" stroke="#0a0a0b" stroke-width="1.5"/>
        <line x1="9" y1="12" x2="9" y2="16" stroke="#0a0a0b" stroke-width="1.5"/>
        <line x1="16" y1="6" x2="9" y2="9" stroke="#0a0a0b" stroke-width="1.5"/>
        <line x1="2" y1="6" x2="9" y2="9" stroke="#0a0a0b" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="wordmark-text">
      <div class="wordmark-title">PROJECT NOVA</div>
      <div class="wordmark-sub">GPU-Accelerated Serverless Wasm Runtime</div>

  <div class="header-stats">
    <div class="stat"><div class="stat-num">22</div><div class="stat-lbl">sessions</div></div>
    <div class="stat"><div class="stat-num">6</div><div class="stat-lbl">phases</div></div>
    <div class="stat"><div class="stat-num">9</div><div class="stat-lbl">crates</div></div>
    <div class="stat"><div class="stat-num">~9mo</div><div class="stat-lbl">timeline</div></div>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main id="main"></main>
</div>

<script>
const PHASES = [
  {
    id: 'all', label: 'All Sessions', color: '#7a7870', bgLight: '#3a3834',
    desc: 'Complete 22-session implementation plan across all phases.',
    tag: 'OVERVIEW',
  },
  {
    id: 0, label: 'Phase 0 · Foundation', color: '#a89060', bgLight: '#3d2e14',
    desc: 'Workspace scaffold, dependency audit, error handling, and observability foundations.',
    tag: 'MONTHS 0–1',
  },
  {
    id: 1, label: 'Phase 1 · Memory', color: '#4a8bb0', bgLight: '#142130',
    desc: 'CUDA Unified Memory allocator, Wasmtime MemoryCreator integration, and isolation hardening.',
    tag: 'MONTHS 1–2',
  },
  {
    id: 2, label: 'Phase 2 · Execution', color: '#3a9060', bgLight: '#142214',
    desc: 'Wasmtime + Tokio async executor, WASI-GPU host bridge, and async GPU dispatch.',
    tag: 'MONTHS 3–4',
  },
  {
    id: 3, label: 'Phase 3 · JIT Compiler', color: '#9060c0', bgLight: '#250f30',
    desc: 'Cranelift pipeline hook, IR normalisation, PTX codegen, kernel cache, and end-to-end auto-offload.',
    tag: 'MONTHS 5–7',
  },
  {
    id: 4, label: 'Phase 4 · Serverless', color: '#b04a3a', bgLight: '#301414',
    desc: 'Memory snapshots, multi-tenant GPU contexts, HTTP API gateway, and developer CLI.',
    tag: 'MONTHS 8–9',
  },
  {
    id: 5, label: 'Phase 5 · Hardening', color: '#b08030', bgLight: '#302514',
    desc: 'Benchmarking suite, OpenTelemetry tracing, security audit & fuzzing, documentation and release.',
    tag: 'MONTHS 9–10',
  },
];

const SESSIONS = [
  {
    id:1, phase:0,
    title: 'Workspace Scaffold & Toolchain',
    goal: 'Produce a compilable, fully-pinned Cargo workspace with all crate skeletons, toolchain configuration, and a passing CI pipeline.',
    tasks: [
      'Create workspace Cargo.toml listing all 9 crates',
      'Scaffold each crate with lib.rs/main.rs and empty pub mod declarations',
      'Create rust-toolchain.toml pinning nightly + components: rustfmt, clippy, rust-src, llvm-tools-preview',
      'Create .github/workflows/ci.yml with fmt, clippy, test jobs on ubuntu-latest with CUDA stub libs',
      'Create Makefile with build, test, bench, fmt, lint, clean targets',
      'Write ARCHITECTURE.md summarising crate dependency graph (must be acyclic)',
    ],
    deliverables: ['nova/ workspace — cargo check --workspace exits 0', 'CI workflow YAML', 'ARCHITECTURE.md'],
    done: ['cargo check --workspace exits 0', 'cargo fmt --check --all exits 0', 'CI YAML validates with actionlint'],
    deps: [],
  },
  {
    id:2, phase:0,
    title: 'Dependency Audit & Feature Flags',
    goal: 'Pin all external dependencies, define feature flags per crate, and document the CUDA environment requirements.',
    tasks: [
      'Add wasmtime 25 (async, cranelift, component-model), tokio 1 (full), cust 0.3, ptx-builder 0.5',
      'Add axum 0.7, prometheus-client 0.22, tracing 0.1, opentelemetry-otlp, serde/serde_json, criterion 0.5',
      'Define Cargo features: nova-mem (unified-memory default / pinned-host-memory fallback)',
      'Define features: nova-exec (async-execution default), nova-jit (auto-offload off by default)',
      'Write docs/CUDA-SETUP.md: toolkit install, driver version matrix, CUDA_ROOT / CUDA_ARCH env vars',
      'Write docs/BUILD.md: build matrix table (CUDA available / CUDA stub / no CUDA)',
    ],
    deliverables: ['Cargo.lock (committed)', 'docs/CUDA-SETUP.md', 'docs/BUILD.md', 'Feature flag docs per crate README'],
    done: ['cargo build --workspace with CUDA stubs exits 0', 'cargo build --workspace --no-default-features exits 0'],
    deps: [1],
  },
  {
    id:3, phase:0,
    title: 'Error Handling & Observability Foundations',
    goal: 'Establish the project-wide error type hierarchy, structured logging, and metrics scaffolding used by every subsequent crate.',
    tasks: [
      'Create nova-core crate; define NovaError enum: CudaError, WasmTrap, WasmCompile, MemoryExhausted, KernelTimeout, TenantIsolationViolation, Io, Serialization',
      'Define TenantId(u64), InstanceId(u128), KernelId(u64) newtypes with Display/Debug via thiserror',
      'Implement NovaMetrics struct with Prometheus gauges/counters: active_instances, gpu_memory_used_bytes, kernel_dispatches_total, kernel_latency_seconds (histogram)',
      'Add nova_core::telemetry::init(log_level, json: bool) tracing initialisation helper',
      'Write unit tests for error Display formatting and metrics registration',
    ],
    deliverables: ['crates/nova-core/ (error.rs, metrics.rs, telemetry.rs, types.rs)', 'All tests passing'],
    done: ['cargo test -p nova-core exits 0', 'cargo doc -p nova-core exits 0 with no missing-doc warnings'],
    deps: [2],
  },
  {

function phaseLabel(phaseId) {
  const labels = {0:'Phase 0',1:'Phase 1',2:'Phase 2',3:'Phase 3',4:'Phase 4',5:'Phase 5'};
  return labels[phaseId] ?? '';
}

function phaseName(phaseId) {
  const names = {0:'Foundation',1:'Memory',2:'Execution',3:'JIT Compiler',4:'Serverless',5:'Hardening'};
  return names[phaseId] ?? '';
}

function filteredSessions() {
  if (activePhase === 'all') return SESSIONS;
  return SESSIONS.filter(s => s.phase === activePhase);
}

            <div class="card-top">
              <div class="session-num" style="background:${bg};color:${color};">S${s.id}</div>
              <div class="card-title">${s.title}</div>
            </div>
            <div class="card-goal">${s.goal.length > 115 ? s.goal.slice(0,112) + '…' : s.goal}</div>
            <div class="card-footer">
              <div class="card-deps">
                ${s.deps.map(d => `<span class="dep-chip">↳ S${d}</span>`).join('')}
              </div>
              <div class="card-tasks-count">${s.tasks.length} tasks</div>
            </div>
          </div>`;
      }).join('')}
    </div>
  `;

  const detailHTML = selectedId ? renderDetail(SESSIONS.find(s => s.id === selectedId)) : '';

  const riskHTML = activePhase === 'all' ? `
    <div class="risk-section">
      <div class="risk-title">// RISK REGISTER</div>
      <table class="risk-table">
        <thead><tr><th>Risk</th><th>Likelihood</th><th>Impact</th><th>Mitigation</th></tr></thead>
        <tbody>
          ${RISKS.map(r => `<tr>
            <td>${r.risk}</td>
            <td><span class="risk-pill ${r.likelihood==='High'?'risk-high':r.likelihood==='Med'?'risk-med':'risk-low'}">${r.likelihood}</span></td>
            <td><span class="risk-pill ${r.impact==='High'?'risk-high':r.impact==='Med'?'risk-med':'risk-low'}">${r.impact}</span></td>
            <td>${r.mitigation}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>
  ` : '';

  main.innerHTML = `
    <div class="phase-header">
      <div>
        <div class="phase-title">${activePhase === 'all' ? 'All Sessions' : PHASES.find(p=>p.id===activePhase)?.label}</div>
        <div class="phase-desc">${activePhase === 'all' ? 'Click any session card to expand its full brief, tasks, deliverables, and acceptance criteria.' : PHASES.find(p=>p.id===activePhase)?.desc}</div>
      </div>
      <span class="phase-tag" style="background:${activePhase==='all'?'#3a3834':'phaseBgMap[activePhase]'};color:${activePhase==='all'?'#7a7870':phaseColorMap[activePhase]};border:1px solid ${activePhase==='all'?'#3a3834':phaseBgMap[activePhase]}">
        ${activePhase === 'all' ? '22 SESSIONS' : PHASES.find(p=>p.id===activePhase)?.tag}
      </span>
    </div>
    ${overviewHTML}
    ${detailHTML}
    ${gridHTML}
    ${riskHTML}
  `;

  // Fix phase tag styling
  const tag = main.querySelector('.phase-tag');
  if (tag && activePhase !== 'all') {
    const bg = phaseBgMap[activePhase];
    const c = phaseColorMap[activePhase];
    tag.style.background = bg;
    tag.style.color = c;
    tag.style.border = `1px solid ${bg}`;
  }

  // Hover effect on cards
  main.querySelectorAll('.session-card').forEach(card => {
    const accent = card.querySelector('.card-accent');
    card.addEventListener('mouseenter', () => { if (accent) accent.style.opacity = '1'; });
    card.addEventListener('mouseleave', () => {
      const sid = parseInt(card.getAttribute('onclick').match(/\d+/)[0]);
      if (accent && selectedId !== sid) accent.style.opacity = '0';
    });
  });
}

function renderDetail(s) {
  if (!s) return '';
  const color = phaseColorMap[s.phase];
  const bg = phaseBgMap[s.phase];
  const depSessions = s.deps.map(d => SESSIONS.find(x => x.id === d)).filter(Boolean);

  return `
    <div class="detail-panel" style="border-color:${color}33;">
      <div class="detail-header" style="border-bottom-color:${color}22;">
        <div class="detail-snum" style="background:${bg};color:${color};">Session ${s.id}</div>
        <div class="detail-title-wrap">
          <div class="detail-title">${s.title}</div>
          <div class="detail-phase-tag">${phaseLabel(s.phase)} · ${phaseName(s.phase)}</div>
        </div>
        <button class="detail-close" onclick="closeDetail()" aria-label="Close detail">×</button>
      </div>
      <div class="detail-body">
        <div class="detail-col">
          <div class="detail-section">
            <div class="detail-label">Goal</div>
            <div class="detail-goal-text">${s.goal}</div>
          </div>
          ${depSessions.length ? `
          <div class="detail-section">
            <div class="detail-label">Depends on</div>
            <div class="dep-list">
              ${depSessions.map(d => `<div class="dep-item"><span style="color:${phaseColorMap[d.phase]}">S${d.id}</span> — ${d.title}</div>`).join('')}
            </div>
          </div>` : ''}
          <div class="detail-section">
            <div class="detail-label">Tasks (${s.tasks.length})</div>
            <ul class="task-list">${s.tasks.map(t => `<li>${t}</li>`).join('')}</ul>
          </div>
        </div>
        <div class="detail-col">
          <div class="detail-section">
            <div class="detail-label">Deliverables</div>
            <div class="deliverable-list">
              ${s.deliverables.map(d => `<div class="deliverable">${d}</div>`).join('')}
            </div>
          </div>
          <div class="detail-section">
            <div class="detail-label">Done when</div>
            <ul class="done-list">${s.done.map(d => `<li>${d}</li>`).join('')}</ul>
          </div>
        </div>
      </div>
    </div>
  `;
}

function setPhase(id) {
  activePhase = id;
  selectedId = null;
  renderSidebar();
  renderMain();
}

function selectSession(id) {
  if (selectedId === id) { selectedId = null; }
  else { selectedId = id; }
  renderMain();
  if (selectedId) {
    setTimeout(() => {
      const panel = document.querySelector('.detail-panel');
      if (panel) panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 50);
  }
}

function closeDetail() {
  selectedId = null;
  renderMain();
}

renderSidebar();
renderMain();
</script>
</body>
</html>
