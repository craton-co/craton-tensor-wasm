[workspace]
resolver = "2"
members = [
    "crates/tensor-wasm-core",
    "crates/tensor-wasm-mem",
    "crates/tensor-wasm-exec",
    "crates/tensor-wasm-wasi-gpu",
    "crates/tensor-wasm-jit",
    "crates/tensor-wasm-snapshot",
    "crates/tensor-wasm-tenant",
    "crates/tensor-wasm-api",
    "crates/tensor-wasm-cli",
    "crates/tensor-wasm-bench",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.3.5"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
authors = ["Craton Software Company <security@craton.com.ar>"]
repository = "https://github.com/craton-co/craton-tensor-wasm"

# Centralised dependency versions. Crates inherit via `dep.workspace = true`.
# CUDA-dependent crates (cust, ptx-builder) are marked `optional = true` so the
# default `cargo build --workspace` succeeds on hosts without CUDA libraries.
# Enabling the `unified-memory` feature on tensor-wasm-mem (transitively) pulls them in.
[workspace.dependencies]
# Internal crates — both `path` (used during workspace builds) and `version`
# (required by crates.io publish) are specified. Member crates reference these
# via `tensor-wasm-foo = { workspace = true }`. `tensor-wasm-cli` and
# `tensor-wasm-bench` are `publish = false`, so they are intentionally omitted.
tensor-wasm-core = { path = "crates/tensor-wasm-core", version = "0.3.5" }
tensor-wasm-mem = { path = "crates/tensor-wasm-mem", version = "0.3.5" }
tensor-wasm-exec = { path = "crates/tensor-wasm-exec", version = "0.3.5" }
tensor-wasm-wasi-gpu = { path = "crates/tensor-wasm-wasi-gpu", version = "0.3.5" }
tensor-wasm-jit = { path = "crates/tensor-wasm-jit", version = "0.3.5" }
tensor-wasm-snapshot = { path = "crates/tensor-wasm-snapshot", version = "0.3.5" }
tensor-wasm-tenant = { path = "crates/tensor-wasm-tenant", version = "0.3.5" }
tensor-wasm-api = { path = "crates/tensor-wasm-api", version = "0.3.5" }

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# Wasmtime (pinned to 25.x — minor version locked per risk register)
wasmtime = { version = "25", default-features = false, features = ["async", "cranelift", "component-model", "runtime"] }
wasmtime-wasi = "25"
wat = "1"
wasmparser = "0.218"
cranelift-codegen = "0.111"

# CUDA — gated by per-crate feature flags. Workspace deps cannot carry
# `optional = true` themselves; the individual crate `[dependencies]` tables
# add `optional = true` and a corresponding feature in their `[features]` table.
# cust 0.3.2 has a known bug at src/memory/device/device_buffer.rs:9 where
# `pub use bytemuck;` is unconditional (the `cfg_attr(docsrs, ...)` only
# sets docs metadata). Enabling the bytemuck feature pulls the optional
# dep in for real, sidestepping the "no external crate `bytemuck`" build
# error on hosts that actually exercise the cust path. The bytemuck-related
# DeviceBuffer methods are unused by TensorWasm so the additional surface is
# cost-free.
cust = { version = "0.3", default-features = false, features = ["bytemuck"] }
ptx-builder = "0.5"
# cudarc — actively maintained alternative to `cust`. Pinned at 0.13 (latest
# 0.13.x as of 2026-05). Driver-only feature set keeps the build script light;
# `cuda-12000` selects CUDA 12.0+ headers (matches the toolkit on the S22
# runner). Currently behind the per-crate `cudarc-backend` feature flag while
# the cust → cudarc migration spike (see `docs/CUDARC-SPIKE.md`) lands.
cudarc = { version = "0.13", default-features = false, features = ["driver", "cuda-12000"] }

# cuda-oxide — NVIDIA Labs' new Rust-to-CUDA compiler + host runtime, v0.1.0
# alpha released 2026-05-09 (repo: github.com/NVlabs/cuda-oxide). Adopted as
# the v0.5 cust successor per RFC 0001 (rfcs/0001-cuda-oxide-integration.md).
# The three host-side crates we depend on here are `cuda-host` (the RAII
# runtime: contexts, allocations, streams), `cuda-core` (the underlying
# FFI surface that `cuda-host` wraps), and `cuda-async` (Tokio integration
# for the back-pressure / future-sync path benchmarked in W4.6). The
# kernel-authoring crates (`cuda-device`, `cuda-macros`) are NOT pulled in
# here; the W4.5 "Path C" kernel-authoring surface lands in a follow-up.
#
# TOOLCHAIN ALIGNMENT: cuda-oxide pins `nightly-2026-04-03` in its own
# rust-toolchain.toml. TensorWasm now pins the same channel (bumped
# 2026-05-25 from `nightly-2026-03-15`), so the `cuda-oxide-backend`
# feature on `tensor-wasm-mem` builds on the workspace default toolchain
# — no `RUSTUP_TOOLCHAIN` override or branch-local rust-toolchain.toml
# edit needed. The feature is still opt-in through v0.3.x because the
# parity port (per RFC 0001 "Rollout — v0.4 (parity)") has not landed
# yet; the toolchain alignment is the prerequisite, not the port.
#
# Pliron (cuda-oxide's MLIR-like IR framework) is pinned in cuda-oxide's
# own Cargo.toml to a git revision rather than crates.io. That pin
# transitively lands in our lockfile when the feature is enabled; see
# docs/REPRODUCIBLE-BUILDS.md for the cargo-deny allowlist row that the
# v0.4 PR will add.
#
# TODO(v0.4 / when cuda-oxide ships v0.2): re-check whether `cuda-host`,
# `cuda-core`, `cuda-async` are still the right entry points and whether
# Pliron has published to crates.io.
#
# Source: NVlabs/cuda-oxide is published on GitHub but its workspace members
# (`cuda-host`, `cuda-core`, `cuda-async`) are NOT yet on crates.io as of
# 2026-05-25 (the crates.io `cuda-oxide` name is a different, unrelated
# 2018-era project). For v0.3.1 we pin via git rev (the v0.1.0 tag SHA,
# 4a56e4220aab8ce5d085a411e7f806cebb647d14) so the dep is reproducible
# and dependabot can't silently flip it. v0.4 should switch to crates.io
# versions once NVlabs publishes. Reproducibility audit-trail lives in
# `docs/REPRODUCIBLE-BUILDS.md` §"git-pinned sources" and the matching
# allowlist entries in `deny.toml`.
#
# Pliron (cuda-oxide's MLIR-like IR framework) is pinned in cuda-oxide's
# own Cargo.toml at rev `b51e73b11648508188184451adebdcf63957b7fe`
# (vaivaswatha/pliron). That pin transitively lands in our lockfile when
# the cuda-oxide-backend feature is enabled; we do NOT redeclare it here
# (cargo.lock captures it). `deny.toml` allowlists that specific rev so
# `cargo deny check sources` doesn't reject the build.
cuda-host   = { git = "https://github.com/NVlabs/cuda-oxide", rev = "4a56e4220aab8ce5d085a411e7f806cebb647d14", default-features = false }
cuda-core   = { git = "https://github.com/NVlabs/cuda-oxide", rev = "4a56e4220aab8ce5d085a411e7f806cebb647d14", default-features = false }
cuda-async  = { git = "https://github.com/NVlabs/cuda-oxide", rev = "4a56e4220aab8ce5d085a411e7f806cebb647d14", default-features = false }
# `cuda-device` and `cuda-macros` are the kernel-authoring side of
# cuda-oxide (device-side primitives + `#[kernel]` / `cuda_launch!`
# proc-macros). Added at W4.1 (2026-05-27) so the new
# `tensor-wasm-mem/cuda-oxide-host-backend` feature can toggle the
# complete cuda-oxide surface with a single flag. Same git pin / SHA as
# the other three host crates above so dependabot cannot drift them
# apart.
cuda-device = { git = "https://github.com/NVlabs/cuda-oxide", rev = "4a56e4220aab8ce5d085a411e7f806cebb647d14", default-features = false }
cuda-macros = { git = "https://github.com/NVlabs/cuda-oxide", rev = "4a56e4220aab8ce5d085a411e7f806cebb647d14", default-features = false }

# HTTP / API
axum = { version = "0.7", features = ["macros", "tracing"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "cors"] }
hyper = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = "0.27"
opentelemetry = "0.26"
opentelemetry-otlp = { version = "0.26", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
prometheus-client = "0.24"

# Errors / serde
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
zstd = "0.13"

# Concurrency utilities
dashmap = "6"
lru = "0.12"
parking_lot = "0.12"
once_cell = "1"
crossbeam-channel = "0.5"

# Hashing — used for stable, cross-Rust-version fingerprints (TensorWasmKernelBlueprint).
blake3 = "1"

# Hex encoding/decoding — used by the CLI to read 32-byte HMAC-SHA256 keys
# from disk (snapshot signing) and to render them as ASCII for the
# `X-TensorWasm-Snapshot-HMAC-Key` HTTP header. Pinned at 0.4 (latest 0.4.x).
hex = "0.4"

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Test / bench
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
proptest = "1"
tokio-test = "0.4"
tempfile = "3"
mockall = "0.13"

# Logging / time
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = 1
panic = "abort"

[profile.bench]
inherits = "release"

[profile.dev]
opt-level = 0
debug = 2
