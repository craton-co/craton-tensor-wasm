[workspace]
resolver = "2"
members = [
    "crates/bali-core",
    "crates/bali-mem",
    "crates/bali-exec",
    "crates/bali-wasi-gpu",
    "crates/bali-jit",
    "crates/bali-snapshot",
    "crates/bali-tenant",
    "crates/bali-api",
    "crates/bali-cli",
    "crates/bali-bench",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "Apache-2.0"
authors = ["Project Bali Contributors"]
repository = "https://github.com/project-bali/bali"

# Centralised dependency versions. Crates inherit via `dep.workspace = true`.
# CUDA-dependent crates (cust, ptx-builder) are marked `optional = true` so the
# default `cargo build --workspace` succeeds on hosts without CUDA libraries.
# Enabling the `unified-memory` feature on bali-mem (transitively) pulls them in.
[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# Wasmtime (pinned to 25.x — minor version locked per risk register)
wasmtime = { version = "25", default-features = false, features = ["async", "cranelift", "component-model", "runtime"] }
wasmtime-wasi = "25"
wat = "1"
wasmparser = "0.218"
cranelift-codegen = "0.111"

# CUDA — gated by per-crate feature flags. Workspace deps cannot carry
# `optional = true` themselves; the individual crate `[dependencies]` tables
# add `optional = true` and a corresponding feature in their `[features]` table.
cust = { version = "0.3", default-features = false }
ptx-builder = "0.5"

# HTTP / API
axum = { version = "0.7", features = ["macros", "tracing"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "cors"] }
hyper = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-opentelemetry = "0.27"
opentelemetry = "0.26"
opentelemetry-otlp = { version = "0.26", features = ["grpc-tonic"] }
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
prometheus-client = "0.22"

# Errors / serde
thiserror = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
zstd = "0.13"

# Concurrency utilities
dashmap = "6"
lru = "0.12"
parking_lot = "0.12"
once_cell = "1"
crossbeam-channel = "0.5"

# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Test / bench
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
proptest = "1"
tokio-test = "0.4"
tempfile = "3"
mockall = "0.13"

# Logging / time
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = 1

[profile.bench]
inherits = "release"

[profile.dev]
opt-level = 0
debug = 2
