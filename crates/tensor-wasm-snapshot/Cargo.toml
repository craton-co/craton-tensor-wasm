[package]
name = "tensor-wasm-snapshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Wasm + GPU memory snapshot and restore for fast cold-start."
homepage = "https://github.com/craton-co/craton-tensor-wasm"
documentation = "https://docs.rs/tensor-wasm-snapshot"
readme = "README.md"
keywords = ["wasm", "snapshot", "checkpoint", "restore", "wasmtime"]
categories = ["wasm", "encoding"]

[lib]

[dependencies]
tensor-wasm-core = { workspace = true }
bincode.workspace = true
crc32fast = "1"
serde.workspace = true
serde_bytes = "0.11"
tracing.workspace = true
zstd.workspace = true
cust = { workspace = true, optional = true }
# HMAC-SHA256 snapshot signing (v3 wire format). Pulled in only when the
# `signed-snapshots` feature is enabled; `subtle` provides the
# constant-time equality check used to compare the trailing 32-byte
# signature against the recomputed HMAC.
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
subtle = { version = "2", optional = true }
# Best-effort scrub of the in-memory HMAC key on drop. Wraps the 32-byte key
# field in `zeroize::Zeroizing` so swap-backed memory is overwritten when
# the writer/reader is dropped. Gated behind `signed-snapshots` since
# the field itself only exists under that feature — keeps the no-feature
# build dep-surface identical to before.
zeroize = { workspace = true, optional = true }
# Opt-in convergence path onto the unified content-addressed artifact store
# (see `docs/ARTIFACT-STORE.md`). Activating the `artifact-backing` feature
# enables `SnapshotWriter::capture_to_artifact_store` and
# `SnapshotReader::restore_from_artifact_store`, which wrap the bincode-
# encoded `Snapshot` in `DiskArtifactStore::put` / `get` instead of the
# inline v2/v3 envelope. The default capture / restore methods continue
# to emit and parse the legacy envelope byte-for-byte; this feature is
# purely additive for v0.3.8.
tensor-wasm-artifacts = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
# Property-based roundtrip coverage — see `tests/roundtrip_proptest.rs`.
# Pulled in only at test time so the published crate retains its current
# dep surface.
proptest = { workspace = true }

[features]
default = ["signed-snapshots"]
# Enables the GPU-side restore path that materialises the snapshot's
# `gpu_memory` blob directly into a CUDA UnifiedBuffer and prefetches it to
# the target device. Pulls in `cust`; off by default so the crate builds on
# CUDA-less hosts.
cuda = ["dep:cust"]
# Enables HMAC-SHA256 signing/verification for snapshots (v3 wire format).
# When enabled (the default), `SnapshotWriter::with_hmac_sha256_key` and
# `SnapshotReader::with_hmac_sha256_key` become available; without it the
# writer/reader continue to handle only the unsigned v2 wire format.
signed-snapshots = ["dep:hmac", "dep:sha2", "dep:subtle", "dep:zeroize"]
# Opt-in artifact-store backing for snapshots. When enabled, exposes
# `SnapshotWriter::capture_to_artifact_store` and
# `SnapshotReader::restore_from_artifact_store` for routing snapshots
# through the unified `tensor-wasm-artifacts::DiskArtifactStore` envelope
# (BLAKE3 content-hash + HMAC-SHA256 trailer + key-fingerprinted
# filenames). The legacy inline v2/v3 envelope produced by `capture` and
# parsed by `restore` is unaffected — v0.4 will flip the default
# capture/restore path; v0.3.8 only ships the opt-in.
artifact-backing = ["dep:tensor-wasm-artifacts"]

[package.metadata.docs.rs]
all-features = false
features = ["signed-snapshots", "artifact-backing"]
rustdoc-args = ["--cfg", "docsrs"]
