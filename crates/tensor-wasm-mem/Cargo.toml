[package]
name = "tensor-wasm-mem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "CUDA Unified Memory allocator and Wasmtime `MemoryCreator` integration."
homepage = "https://github.com/craton-co/craton-tensor-wasm"
documentation = "https://docs.rs/tensor-wasm-mem"
readme = "README.md"
keywords = ["wasm", "cuda", "memory", "wasmtime", "gpu"]
categories = ["memory-management", "wasm"]

[lib]

[dependencies]
anyhow.workspace = true
tensor-wasm-core = { workspace = true }
# Per-tenant GPU memory quota accounting (roadmap feature #8). The
# `TensorWasmMemoryCreator::with_tenant_context` builder accepts an
# `Arc<TenantContext>` so the allocator path can call
# `consume_gpu_bytes` / `release_gpu_bytes` on every
# `UnifiedBuffer` lifecycle event. Adding the dep here cannot
# introduce a cycle: `tensor-wasm-tenant` itself only depends on
# `tensor-wasm-core`.
tensor-wasm-tenant = { workspace = true }
parking_lot.workspace = true
region = "3"
thiserror.workspace = true
tracing.workspace = true
wasmtime.workspace = true
cust = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
# cuda-oxide host-runtime crates — pulled in ONLY under the opt-in
# `experimental-cuda-oxide-host-backend` feature (NOT under
# `cuda-oxide-backend`, which is the dep-less scaffold). NOTE: that feature
# is intentionally non-building (its module opens with a `compile_error!`)
# because the host FFI surface is inferred and unverified. Building these
# crates requires:
#
#   * a CUDA Toolkit (`CUDA_TOOLKIT_PATH` env var pointing at the install
#     root; defaults to `/usr/local/cuda` on Linux), and
#   * a working `libclang` reachable through `LIBCLANG_PATH` (cuda-bindings
#     runs bindgen against `<cuda.h>` in its build script).
#
# The default Windows / Linux contributor box without these is unable to
# compile the cuda-bindings crate, which is why the host-backend deps live
# behind a separate strict-superset feature flag rather than the base
# `cuda-oxide-backend` scaffold. The pattern mirrors W3.3's
# `pliron-llvm-backend` on `tensor-wasm-jit`. See `docs/CUDA-SETUP.md`
# section "Using the cuda-oxide-host-backend feature" for the toolchain
# install matrix. RFC 0001 (rfcs/0001-cuda-oxide-integration.md) tracks
# the full adoption rationale and the nightly-2026-04-03 toolchain pin
# aligning the workspace with cuda-oxide's own rust-toolchain.toml.
cuda-host = { workspace = true, optional = true }
cuda-core = { workspace = true, optional = true }
cuda-async = { workspace = true, optional = true }
cuda-device = { workspace = true, optional = true }
cuda-macros = { workspace = true, optional = true }

[dev-dependencies]
wat.workspace = true
wasmtime.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
# W4.2 — cross-backend snapshot conformance tests pull in the snapshot
# crate to drive the capture/restore round-trip against bytes produced by
# each CUDA backing (`unified-memory` / cust, `cudarc-backend`,
# `experimental-cuda-oxide-host-backend`). The snapshot crate itself is intentionally
# backend-agnostic (bytes-in, bytes-out); these tests are the regression
# guard documented in RFC 0001 "Test plan" that the W1.3 cross-version
# compat suite runs cleanly under each backend feature.
tensor-wasm-snapshot = { workspace = true }

[features]
# Default is empty so `cargo build` works on hosts without a CUDA toolkit
# (cust's build script panics without one). The `unified-memory` feature is
# opt-in via `--features unified-memory` on CUDA hosts. CI may also enable it
# once stub libraries are provisioned.
default = []
unified-memory = ["dep:cust"]
# `cudarc-backend` is the cust → cudarc migration spike. When enabled it
# pulls in the `cudarc` crate and exposes a parallel `UnifiedBuffer`
# implementation under `crate::cudarc_backend`. The cust path remains the
# default; both backends coexist for the v0.2 spike. See
# `docs/CUDARC-SPIKE.md` for the API mapping and cutover plan.
cudarc-backend = ["dep:cudarc"]
# T39 (v0.4): driver-level per-tenant GPU memory cap via
# `cuMemPoolSetAttribute(CU_MEMPOOL_ATTR_RELEASE_THRESHOLD, ...)`.
# Strict-superset alias for `cudarc-backend` — the `cuMemPool*` API
# only exists on the cudarc side (cust 0.3.x has no binding) so
# enabling this feature pulls cudarc in automatically. Operators turn
# it on with `--features gpu-mem-pool` to make their intent explicit
# on the command line; the alias guarantees the resolver picks up
# `cuda_mem_pool` and the `UnifiedBuffer::new_in_tenant_pool` allocator
# in one go. See `docs/GPU-QUOTAS.md` for the threat model the driver
# pin closes (a tenant who obtained a raw CUDA driver handle and
# bypassed the in-process `consume_gpu_bytes` counter).
gpu-mem-pool = ["cudarc-backend"]
# `cuda-oxide-backend` is the v0.5 cust-successor scaffold (RFC 0001 —
# rfcs/0001-cuda-oxide-integration.md). It is intentionally **dep-less**:
# enabling it exposes the `crate::cuda_oxide_backend` module (with the
# scaffold `CudaOxideUnifiedBuffer` returning the documented
# `NOT_YET_WIRED` sentinel) but does NOT pull `cuda-host`, `cuda-core`,
# `cuda-device`, or `cuda-macros` into the resolved dependency graph.
# That keeps `cargo check --features cuda-oxide-backend` building cleanly
# on contributor boxes that lack a CUDA Toolkit and `libclang`. The real
# host-runtime port — `cuMemAllocManaged` and friends — lives behind the
# strict-superset `experimental-cuda-oxide-host-backend` feature below.
#
# v0.3.1 ships the FEATURE FLAG and an empty module only; the unified-
# memory port lands at v0.4 per RFC 0001 "Rollout — v0.4 (parity)" and is
# wired through the `experimental-cuda-oxide-host-backend` superset feature so the
# scaffold itself stays dep-less. The feature is intentionally mutually
# compatible with `unified-memory` and `cudarc-backend`; enabling all
# three at once is valid (and is what CI will exercise once the parity
# port lands).
cuda-oxide-backend = []
# `experimental-cuda-oxide-host-backend` is a STRICT SUPERSET of
# `cuda-oxide-backend` (W3.3 pliron-llvm-backend → pliron-backend pattern).
# It pulls in the four cuda-oxide host-side crates intended for the v0.4
# parity port:
#
#   * `cuda-host`  — kernel launch helpers, LtoIR loader
#   * `cuda-core`  — RAII context / stream / module / memory wrappers and
#                    the raw `cuda_bindings` re-export used here for
#                    `cuMemAllocManaged`, `cuMemPrefetchAsync`,
#                    `cuMemAdvise`, `cuMemFree_v2`
#   * `cuda-device`— device-side primitives (DisjointSlice, kernel attr).
#                    Pulled in here so a single feature flag toggles the
#                    complete cuda-oxide surface; not directly imported
#                    from `cuda_oxide_backend.rs` today.
#   * `cuda-macros`— `#[kernel]` / `cuda_launch!` proc-macros; same
#                    rationale as cuda-device — toggled together so v0.4
#                    callers do not need to layer features.
#
# !!! EXPERIMENTAL / DOES NOT BUILD !!!
# The `cuda_oxide_backend::host_backend` module this feature gates is ~350
# LOC of `unsafe` FFI written against an INFERRED, never-compiled cuda-oxide
# host API (every `// W4.1: API surface inferred ... verify` comment). It
# has NEVER been compiled against the real `cuda-bindings`-generated
# symbols. Enabling this feature is deliberately wired to FAIL the build:
# the `host_backend` module opens with a `compile_error!` so an operator
# who flips the flag gets a clear message instead of unverified unsafe
# code. The `experimental-` prefix exists to make that non-buildable status
# obvious on the command line. Do NOT enable until a LIBCLANG-equipped CI
# runner has actually compiled the port and the `compile_error!` is lifted.
#
# When it does graduate it will additionally require the contributor host to
# provide BOTH a CUDA Toolkit (so `<cuda.h>` is reachable) AND `libclang`
# via `LIBCLANG_PATH` (so the `cuda-bindings` build script can run bindgen).
# See `docs/CUDA-SETUP.md` section "Using the cuda-oxide-host-backend
# feature" for the install matrix and the `LIBCLANG_PATH` /
# `CUDA_TOOLKIT_PATH` env vars.
experimental-cuda-oxide-host-backend = [
    "cuda-oxide-backend",
    "dep:cuda-host",
    "dep:cuda-core",
    "dep:cuda-device",
    "dep:cuda-macros",
]

[package.metadata.docs.rs]
all-features = false
features = []
rustdoc-args = ["--cfg", "docsrs"]
