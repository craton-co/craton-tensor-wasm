[package]
name = "tensor-wasm-mem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "CUDA Unified Memory allocator and Wasmtime `MemoryCreator` integration."
homepage = "https://github.com/craton-co/craton-tensor-wasm"
documentation = "https://docs.rs/tensor-wasm-mem"
readme = "README.md"
keywords = ["wasm", "cuda", "memory", "wasmtime", "gpu"]
categories = ["memory-management", "wasm"]

[lib]

[dependencies]
anyhow.workspace = true
tensor-wasm-core = { path = "../tensor-wasm-core" }
parking_lot.workspace = true
region = "3"
thiserror.workspace = true
tracing.workspace = true
wasmtime.workspace = true
cust = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }
# cuda-oxide host-runtime crates — pulled in only under the opt-in
# `cuda-oxide-backend` feature. See RFC 0001 (rfcs/0001-cuda-oxide-integration.md)
# for adoption rationale and the workspace Cargo.toml comment block for the
# nightly-2026-04-03 toolchain caveat.
cuda-host = { workspace = true, optional = true }
cuda-core = { workspace = true, optional = true }
cuda-async = { workspace = true, optional = true }

[dev-dependencies]
wat.workspace = true
wasmtime.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[features]
# Default is empty so `cargo build` works on hosts without a CUDA toolkit
# (cust's build script panics without one). The `unified-memory` feature is
# opt-in via `--features unified-memory` on CUDA hosts. CI may also enable it
# once stub libraries are provisioned.
default = []
unified-memory = ["dep:cust"]
# `cudarc-backend` is the cust → cudarc migration spike. When enabled it
# pulls in the `cudarc` crate and exposes a parallel `UnifiedBuffer`
# implementation under `crate::cudarc_backend`. The cust path remains the
# default; both backends coexist for the v0.2 spike. See
# `docs/CUDARC-SPIKE.md` for the API mapping and cutover plan.
cudarc-backend = ["dep:cudarc"]
# `cuda-oxide-backend` is the v0.5 cust-successor scaffold (RFC 0001 —
# rfcs/0001-cuda-oxide-integration.md). When enabled it pulls in the
# `cuda-host`, `cuda-core`, and `cuda-async` crates from NVIDIA Labs'
# cuda-oxide v0.1.0 release and exposes a stub `CudaOxideUnifiedBuffer`
# under `crate::cuda_oxide_backend`. v0.3.1 ships the FEATURE FLAG and an
# empty module only — the unified-memory port lands at v0.4. The feature
# is intentionally mutually compatible with `unified-memory` and
# `cudarc-backend`; enabling all three at once is valid (and is what CI
# will exercise once the parity port lands). The workspace's pinned
# nightly-2026-04-03 toolchain matches cuda-oxide's own pin, so the
# feature builds on the default workspace toolchain — no override
# required. See the workspace Cargo.toml comment for the alignment
# history.
cuda-oxide-backend = ["dep:cuda-host", "dep:cuda-core", "dep:cuda-async"]

[package.metadata.docs.rs]
all-features = false
features = []
rustdoc-args = ["--cfg", "docsrs"]
