[package]
name = "tensor-wasm-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Developer CLI for Craton TensorWasm (`tensor-wasm run`, `tensor-wasm deploy`, `tensor-wasm invoke`, ...)."
homepage = "https://github.com/craton-co/craton-tensor-wasm"
documentation = "https://docs.rs/tensor-wasm"
readme = "README.md"
keywords = ["wasm", "cli", "serverless", "wasmtime"]
categories = ["command-line-utilities", "wasm"]
publish = false

[[bin]]
name = "tensor-wasm"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time", "fs", "io-util"] }
clap.workspace = true
clap_complete.workspace = true
clap_mangen = "0.2"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking", "stream"] }
base64 = "0.22"
hex.workspace = true
tensor-wasm-core = { workspace = true }
tensor-wasm-exec = { workspace = true }
# Pulled in for `tensor-wasm serve` — the CLI subcommand stands up the api
# crate's router in-process so the README quickstart `tensor-wasm serve
# --addr 0.0.0.0:8080` works without an external binary.
tensor-wasm-api = { workspace = true }
# tensor-wasm-jit: pulled in for the `tensor-wasm kernel` subcommands so
# the CLI can build a signed `KernelManifest` locally (BLAKE3 digest +
# HMAC-SHA256 signature over the canonical envelope) before POSTing it
# to the server. The `kernel-registry` feature gates the registry module
# itself. The dep is unconditional here (no Cargo feature) because the
# kernel subcommands are always compiled into the CLI surface — the
# v0.3.7 scaffold returned exit 3 from a stub, and B6.4 replaces that
# stub with real HTTP calls; either way the CLI is the user-facing
# surface for the feature.
tensor-wasm-jit = { workspace = true, features = ["kernel-registry"] }
# blake3: computes the PTX digest the CLI bakes into the manifest. The
# `tensor-wasm-jit` crate uses blake3 transitively but does not re-export
# it; we declare the dep here against the workspace pin so the CLI does
# not lock in a different minor version of the hash.
blake3.workspace = true
# subtle: constant-time signature comparison in `kernel verify`. The
# `tensor-wasm-jit` registry path uses the same primitive for its
# server-side HMAC compare, but does NOT re-export it; declaring the
# dep here matches the version pin already used by the api crate
# (constant-time bearer-token comparator) so cargo can de-duplicate.
subtle = "2"
# `serve` binds the router via `axum::serve`; declare the dep explicitly
# so we can reference it directly rather than relying on transitives.
axum.workspace = true
# Needed by `snapshot save` to consume `reqwest::Response::bytes_stream()`
# (cli 1.2 streaming-write fix).
futures.workspace = true
# Used by `snapshot save` to write the streamed body to a temp file and
# rename it atomically onto `--output`. Promoted from dev-only because
# the streaming fix needs it in the production path.
tempfile.workspace = true
# `tokio-util`'s `ReaderStream` wraps a `tokio::fs::File` into a chunked
# `Stream<Item = Result<Bytes, _>>` so `snapshot restore` and (future)
# upload paths can feed `reqwest::Body::wrap_stream` instead of buffering
# whole archives in RAM (cli fix 1: streaming restore body).
tokio-util = { workspace = true }

[dev-dependencies]
wat.workspace = true
assert_cmd = "2"
predicates = "3"
insta = "=1.42"
# `temp-env` scopes env-var mutations to a closure so tests don't rely on
# the bare `std::env::set_var` API, which is `unsafe` in Rust 2024 and not
# safe under parallel test execution. Used by the `cmd::tests` env-var
# tests in `src/cmd/mod.rs`.
temp-env.workspace = true
