[package]
name = "tensor-wasm-jit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "JIT pipeline: Cranelift detector, IR normalisation, PTX codegen, kernel cache, deopt."
homepage = "https://github.com/craton-co/craton-tensor-wasm"
documentation = "https://docs.rs/tensor-wasm-jit"
readme = "README.md"
keywords = ["wasm", "jit", "gpu", "cuda", "ptx"]
categories = ["wasm", "compilers", "concurrency"]

[lib]

[dependencies]
tensor-wasm-core = { workspace = true }
blake3.workspace = true
cranelift-codegen.workspace = true
dashmap.workspace = true
lru.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true
wasmparser.workspace = true
wasm-encoder = { version = "0.218", features = ["wasmparser"] }

# pliron — MLIR-style IR framework underpinning cuda-oxide's dialect-mir →
# dialect-llvm → PTX pipeline (RFC 0001 "Pliron lever and the auto-offload
# pipeline"). Optional + feature-gated so the default build is unaffected;
# only `--features cuda-oxide-backend` pulls it in. Published to crates.io
# as of 0.15.0 (the RFC's "Pliron is not on crates.io" drawback is stale —
# pin via crates.io directly rather than a git rev). The cuda-oxide
# upstream itself still uses a git pin at v0.14.0; we choose the published
# 0.15.0 for the dependabot/cargo-deny story documented in
# `docs/REPRODUCIBLE-BUILDS.md`.
pliron = { version = "0.15", optional = true }
# pliron-llvm — LLVM-dialect ops + textual IR emission for pliron 0.15.
# Wave 3.3 uses this to lower `twasm.*` ops emitted by `pliron_lowering`
# into the standard `llvm.*` dialect, which is the last pliron stage
# before textual LLVM IR + the NVPTX backend (W4.x).
#
# IMPORTANT: pliron-llvm 0.15 has a hard transitive dependency on
# `llvm-sys = "221"`, which requires LLVM 221 to be installed system-wide
# (via `LLVM_SYS_221_PREFIX`). On a typical dev machine that's not the
# case, so we gate this dep behind its OWN feature
# (`pliron-llvm-backend`) instead of riding on `cuda-oxide-backend`. The
# stage-2 rewrite (twasm.* → llvm.*) is therefore behind that feature;
# the base `cuda-oxide-backend` build returns
# `PtxError::NotYetWired("twasm_to_llvm_dialect")` from the stage. W4.x
# is the layer that pulls in pliron-llvm on a CI image with the LLVM
# toolchain pre-installed.
pliron-llvm = { version = "0.15", optional = true }

[dev-dependencies]
tokio.workspace = true
wat.workspace = true

[features]
default = []
# Auto-offload is a runtime flag now: the pipeline is always compiled; the
# feature gates additional CUDA-side wiring tested under `--features cuda`.
auto-offload = []
# cuda-oxide-backend gates the `pliron_dialect` scaffold module — the v0.5
# cust-successor lever tracked in `rfcs/0001-cuda-oxide-integration.md`
# (step 4, "Pliron lever and the auto-offload pipeline"). The feature is
# deliberately dep-less today: the v0.3.1 landing is pure-Rust scaffolding
# that fixes the trait surface + Cranelift→dialect-mir mapping table the
# v0.4 author needs as a target. The real Pliron crate dependency (git pin,
# per RFC 0001 "Drawbacks") gets added in the v0.4 implementation PR once
# the workspace toolchain bumps to a nightly that satisfies cuda-oxide's
# `nightly-2026-04-03` pin. Mirrors the `cuda-oxide-backend` feature on
# `tensor-wasm-mem` so a single `--features cuda-oxide-backend` invocation
# at the workspace root selects the full opt-in stack.
#
# Supply-chain note: W3.1 (2026-05-27) discovered that pliron is now on
# crates.io at v0.15 — the RFC 0001 "Drawbacks" claim is stale. The wave-3
# dep here is therefore a regular crates.io version requirement, NOT a git
# pin. The cuda-oxide host crates (cuda-host/core/device/macros) remain
# git-only and arrive in wave 4 with the corresponding `deny.toml`
# allowlist entries (already pre-declared under [sources] allow-git for
# forward compatibility).
cuda-oxide-backend = ["dep:pliron"]
# pliron-llvm-backend pulls in `pliron-llvm` 0.15 to wire the stage-2
# `twasm.*` → `llvm.*` rewrite in `pliron_ptx`. Strict superset of
# `cuda-oxide-backend`. Gated separately because pliron-llvm carries a
# hard `llvm-sys = "221"` dep that requires a system LLVM 221 install
# (W4.x's CI image will satisfy this; the default workstation build will
# not).
pliron-llvm-backend = ["cuda-oxide-backend", "dep:pliron-llvm"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
