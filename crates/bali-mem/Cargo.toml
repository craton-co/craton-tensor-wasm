[package]
name = "bali-mem"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "CUDA Unified Memory allocator and Wasmtime `MemoryCreator` integration."

[lib]

[dependencies]
anyhow.workspace = true
bali-core = { path = "../bali-core" }
parking_lot.workspace = true
thiserror.workspace = true
tracing.workspace = true
wasmtime.workspace = true
cust = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
wat.workspace = true
wasmtime.workspace = true
tempfile.workspace = true

[features]
# Default is empty so `cargo build` works on hosts without a CUDA toolkit
# (cust's build script panics without one). The `unified-memory` feature is
# opt-in via `--features unified-memory` on CUDA hosts. CI may also enable it
# once stub libraries are provisioned. The `pinned-host-memory` flag exists
# for symmetry; the same fallback path runs whenever `unified-memory` is off.
default = []
unified-memory = ["dep:cust"]
pinned-host-memory = []
