[package]
name = "tensor-wasm-wasi-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "`wasi-cuda` host bridge — explicit GPU kernel launch API for Wasm modules."
homepage = "https://github.com/craton-co/craton-tensor-wasm"
documentation = "https://docs.rs/tensor-wasm-wasi-gpu"
readme = "README.md"
keywords = ["wasm", "wasi", "cuda", "gpu", "wasmtime"]
categories = ["wasm", "api-bindings"]

[lib]

[dependencies]
async-trait.workspace = true
tensor-wasm-core = { workspace = true }
tensor-wasm-mem = { workspace = true }
dashmap.workspace = true
parking_lot.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
wasmtime.workspace = true
cust = { workspace = true, optional = true }

[dev-dependencies]
wat.workspace = true
tokio-test.workspace = true
tempfile.workspace = true
proptest = { workspace = true }

[features]
default = []
# `cuda` links cust for the real launch path AND enables tensor-wasm-mem's
# `unified-memory` backing so the end-to-end launch test can back guest linear
# memory with `cuMemAllocManaged` (finding #8): a kernel pointer-arg must
# reference device-addressable memory, which plain host-heap linear memory is
# not. Both pulls require a CUDA toolchain, which `--features cuda` already
# implies, so this adds no new constraint to the default build.
cuda = ["dep:cust", "tensor-wasm-mem/unified-memory"]

# docs.rs build: deliberately disable `cuda` so the CUDA driver libs aren't
# required on the docs.rs builders. The published docs cover the no-CUDA
# stubs and the public ABI surface.
[package.metadata.docs.rs]
features = []
