[package]
name = "bali-snapshot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Wasm + GPU memory snapshot and restore for fast cold-start."

[lib]

[dependencies]
bali-core = { path = "../bali-core" }
bincode.workspace = true
crc32fast = "1"
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zstd.workspace = true
cust = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
# Enables the GPU-side restore path that materialises the snapshot's
# `gpu_memory` blob directly into a CUDA UnifiedBuffer and prefetches it to
# the target device. Pulls in `cust`; off by default so the crate builds on
# CUDA-less hosts.
cuda = ["dep:cust"]
