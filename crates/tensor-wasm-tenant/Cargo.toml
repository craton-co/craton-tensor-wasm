[package]
name = "tensor-wasm-tenant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Multi-tenant CUDA context management (MPS-backed or per-context fallback)."
homepage = "https://github.com/craton-co/craton-tensor-wasm"
documentation = "https://docs.rs/tensor-wasm-tenant"
readme = "README.md"
keywords = ["multi-tenant", "quota", "isolation", "gpu", "tenant"]
categories = ["concurrency", "memory-management"]

[package.metadata.docs.rs]
all-features = false
features = []
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
tensor-wasm-core = { workspace = true }
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
dashmap.workspace = true
cust = { workspace = true, optional = true }
loom = { version = "0.7", optional = true }

[dev-dependencies]
tokio-test.workspace = true
criterion.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "context_switch"
harness = false

[[test]]
name = "loom_consume_release"
path = "tests/loom_consume_release.rs"
required-features = ["loom"]

# The strict-cap-binding test exercises foreign-cap refusal across two
# `TenantRegistry` instances — it only compiles under the feature, which
# turns the registry-token machinery on. Listed here so
# `cargo test --features strict-cap-binding` picks it up by name.
[[test]]
name = "cap_binding_strict"
path = "tests/cap_binding_strict.rs"
required-features = ["strict-cap-binding"]

[features]
default = ["strict-cap-binding"]
cuda = ["dep:cust"]
loom = ["dep:loom"]
# Finding 6 (Part B) forward-wiring: export the isolation-downgrade tally
# through the `tensor-wasm-core` Prometheus registry. OFF by default — it
# only compiles once `tensor-wasm-core` ships
# `TensorWasmMetrics::isolation_downgrade_total() -> &Counter<u64>` (see the
# `ISOLATION_DOWNGRADE_COUNT` docs in `src/context.rs` for the exact API).
# Enabling it activates `metrics.isolation_downgrade_total().inc()` on every
# `ContextIsolated -> StreamIsolated` downgrade in `TenantContextBuilder::build`.
# Until core lands that counter, scrape the process-global tally via the
# always-available `isolation_downgrade_count()` accessor instead.
core-isolation-downgrade-metric = []
# H1 fix: capability-to-registry binding (a cap from registry A is rejected
# by registry B even if both name the same `TenantId`, and forged/foreign
# admin caps are refused) is now UNCONDITIONAL — it is enforced whether or
# not this feature is enabled, including in a release build with
# `default-features = false`. This feature flag is retained only to gate the
# typed `*_strict` admin APIs and the `cap_binding_strict` integration test
# (it no longer toggles any security behaviour). Kept in `default` so the
# `*_strict` surface is available out of the box.
#
# CAVEAT (default-features = false): disabling this feature removes the ONLY
# typed channel for foreign-cap misuse — the `*_strict` admin methods
# (`get_strict`, `unregister_strict`, `len_strict`, `tenants_strict`) that
# return `Result<_, RegistryError::CapabilityFromForeignRegistry>`. The
# binding still fails CLOSED (the legacy `get`/`unregister`/`len`/`tenants`
# collapse a foreign cap to `None`/`0`/empty), but with the typed variants
# compiled out, callers cannot observe *why* an operation returned nothing.
# To keep the misuse observable in that configuration, the foreign-cap
# rejection path ALWAYS emits a `warn!` and bumps the process-global counter
# read by `foreign_cap_rejections_total()` — independent of this feature.
# Alert on a non-zero reading regardless of how the crate is built.
strict-cap-binding = []
