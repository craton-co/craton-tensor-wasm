[package]
name = "tensor-wasm-tenant"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Multi-tenant CUDA context management (MPS-backed or per-context fallback)."
homepage = "https://github.com/craton-co/craton-tensor-wasm"
documentation = "https://docs.rs/tensor-wasm-tenant"
readme = "README.md"
keywords = ["multi-tenant", "quota", "isolation", "cuda", "wasm"]
categories = ["concurrency"]

[package.metadata.docs.rs]
all-features = false
features = []
rustdoc-args = ["--cfg", "docsrs"]

[lib]

[dependencies]
tensor-wasm-core = { workspace = true }
tokio.workspace = true
thiserror.workspace = true
tracing.workspace = true
dashmap.workspace = true
cust = { workspace = true, optional = true }
loom = { version = "0.7", optional = true }

[dev-dependencies]
tokio-test.workspace = true
criterion.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true

[[bench]]
name = "context_switch"
harness = false

[[test]]
name = "loom_consume_release"
path = "tests/loom_consume_release.rs"
required-features = ["loom"]

# The strict-cap-binding test exercises foreign-cap refusal across two
# `TenantRegistry` instances — it only compiles under the feature, which
# turns the registry-token machinery on. Listed here so
# `cargo test --features strict-cap-binding` picks it up by name.
[[test]]
name = "cap_binding_strict"
path = "tests/cap_binding_strict.rs"
required-features = ["strict-cap-binding"]

[features]
default = []
mps = []
cuda = ["dep:cust"]
loom = ["dep:loom"]
# When enabled, `TenantCapability` is bound to the `TenantRegistry` that
# minted it: a cap from registry A is rejected by registry B even if both
# caps name the same `TenantId`. Gated behind a feature so the v0.3 line
# remains source-compatible with call sites that mix caps across
# registries (e.g. test harnesses); v0.4 will flip this on by default.
strict-cap-binding = []
