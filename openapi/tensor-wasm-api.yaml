# SPDX-License-Identifier: Apache-2.0
# Copyright 2026 Craton Software Company
#
# OpenAPI 3.1 description of the Craton TensorWasm HTTP API gateway.
#
# This file is the canonical machine-readable contract for the
# tensor-wasm-api router defined in crates/tensor-wasm-api/src/server.rs and
# handler set in crates/tensor-wasm-api/src/routes.rs. The
# `openapi_validation_test` integration test (under the same crate's tests/
# directory) asserts that every route registered on the live axum router
# has a corresponding `paths` entry below and that the request body schema
# for `POST /functions` round-trips a real `CreateFunctionRequest` Rust
# value. CI runs the test on every PR; see .github/workflows/ci.yml job
# `openapi`.
#
# Indentation is two spaces. Top-level keys (openapi, info, servers, …)
# sit at column 0; the `paths:` map's keys (e.g. `/healthz:`) sit at
# column 2 so the test's structural scan can pick them up. Do not
# introduce tab characters or alternative indentation widths without
# updating the parser in openapi_validation_test.rs.

openapi: 3.1.0
info:
  title: TensorWasm HTTP API
  description: |
    REST surface of a Craton TensorWasm serverless Wasm node. Prose
    documentation, error semantics, and the full middleware stack live in
    crates/tensor-wasm-api/API.md.
  version: 0.1.0
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Craton Software Company
    email: security@craton.com.ar
    url: https://github.com/craton-co/craton-tensor-wasm
servers:
  - url: http://localhost:8080
    description: Local development server
security:
  - BearerAuth: []
tags:
  - name: lifecycle
    description: Function deploy / delete
  - name: invoke
    description: Synchronous and asynchronous invocations
  - name: jobs
    description: Async-job poll API
  - name: ops
    description: Operator-facing endpoints (health, metrics)
  - name: openai-compat
    description: |
      OpenAI-compatible inference gateway shim. The two routes under
      this tag accept the public OpenAI request shapes so off-the-shelf
      SDKs can target the gateway URL. v0.3.5 ships them as a scaffold
      that returns `501 Not Implemented` with the OpenAI error envelope;
      v0.4 wires `model` → deployed-function translation. See
      `docs/OPENAI-COMPAT.md` for the rollout plan.

paths:
  /healthz:
    get:
      tags: [ops]
      summary: Liveness probe
      operationId: healthz
      security: []
      responses:
        "200":
          description: Service is alive
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /metrics:
    get:
      tags: [ops]
      summary: Prometheus text exposition
      operationId: metrics
      responses:
        "200":
          description: Prometheus 0.0.4 text exposition
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /functions:
    post:
      tags: [lifecycle]
      summary: Deploy a new Wasm module
      operationId: createFunction
      description: |
        The bearer token's `:tenant=` scope must cover the tenant supplied
        via `X-TensorWasm-Tenant` (default 0). The resolved tenant is
        recorded on the new record as its owner and gates every subsequent
        invoke / delete; see the `FunctionRecord` schema.
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFunctionRequest"
      responses:
        "200":
          description: Function deployed
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateFunctionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TenantScopeDenied"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"

  /functions/{id}:
    delete:
      tags: [lifecycle]
      summary: Delete a deployed function
      operationId: deleteFunction
      description: |
        Two-layer authorization: (1) the bearer token's `:tenant=` scope
        must cover the tenant supplied via `X-TensorWasm-Tenant`, and
        (2) the function's owning tenant (set at deploy time) must equal
        that same tenant. Either mismatch returns `403 tenant_scope_denied`.
      parameters:
        - $ref: "#/components/parameters/FunctionId"
        - $ref: "#/components/parameters/TenantHeader"
      responses:
        "204":
          description: Function removed
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TenantScopeDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /functions/{id}/invoke:
    post:
      tags: [invoke]
      summary: Invoke a function synchronously
      operationId: invokeFunction
      description: |
        Two-layer authorization: (1) the bearer token's `:tenant=` scope
        must cover the tenant supplied via `X-TensorWasm-Tenant`, and
        (2) the function's owning tenant (set at deploy time) must equal
        that same tenant. Either mismatch returns `403 tenant_scope_denied`.
      parameters:
        - $ref: "#/components/parameters/FunctionId"
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeRequest"
      responses:
        "200":
          description: Invocation complete
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvokeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TenantScopeDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/InvokeTimeout"

  /functions/{id}/invoke-async:
    post:
      tags: [invoke]
      summary: Invoke a function asynchronously
      operationId: invokeFunctionAsync
      description: |
        Two-layer authorization: (1) the bearer token's `:tenant=` scope
        must cover the tenant supplied via `X-TensorWasm-Tenant`, and
        (2) the function's owning tenant (set at deploy time) must equal
        that same tenant. Either mismatch returns `403 tenant_scope_denied`.
      parameters:
        - $ref: "#/components/parameters/FunctionId"
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeRequest"
      responses:
        "202":
          description: Job accepted
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvokeAsyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TenantScopeDenied"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"

  /jobs/{id}:
    get:
      tags: [jobs]
      summary: Poll an async-invocation job
      operationId: getJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current job status
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/completions:
    post:
      tags: [openai-compat]
      summary: OpenAI-compatible text completions (scaffold)
      description: |
        Scaffold; v0.4 wires translation. Accepts the public OpenAI
        `POST /v1/completions` request shape so that off-the-shelf SDKs
        (`openai`, `openai-node`, LangChain, …) deserialise without
        modification. The v0.3.5 implementation returns `501 Not
        Implemented` with the OpenAI-shape error envelope
        (`OpenAiError`); v0.4 lands the actual `model` → deployed
        function translation and streams tokens back as SSE
        `data:` chunks.

        Tenant scope is derived from the bearer token's `:tenant=...`
        clause (see `BearerAuth`) — the `X-TensorWasm-Tenant` header is
        NOT honoured on this route, because OpenAI SDKs never send it.
        See `docs/OPENAI-COMPAT.md` for the rollout plan and
        `crates/tensor-wasm-api/src/openai.rs` for the request types.
      operationId: openaiCompletions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionsRequest"
      responses:
        "400":
          description: Malformed request body (OpenAI envelope shape).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          description: |
            Scaffold response. Envelope `error.code` is
            `openai_not_yet_wired`; clients should branch on that code
            rather than the human-readable `message`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAiError"

  /v1/chat/completions:
    post:
      tags: [openai-compat]
      summary: OpenAI-compatible chat completions (scaffold)
      description: |
        Scaffold; v0.4 wires translation. Accepts the public OpenAI
        `POST /v1/chat/completions` request shape (system / user /
        assistant / tool message history). The v0.3.5 implementation
        returns `501 Not Implemented` with the OpenAI-shape error
        envelope; v0.4 lands model → function translation and SSE
        streaming.

        Tenant scope is derived from the bearer token's `:tenant=...`
        clause (see `BearerAuth`) — the `X-TensorWasm-Tenant` header is
        NOT honoured on this route, because OpenAI SDKs never send it.
        See `docs/OPENAI-COMPAT.md` for the rollout plan.
      operationId: openaiChatCompletions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionsRequest"
      responses:
        "400":
          description: Malformed request body (OpenAI envelope shape).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "501":
          description: |
            Scaffold response. Envelope `error.code` is
            `openai_not_yet_wired`; clients should branch on that code
            rather than the human-readable `message`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAiError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer token from the TENSOR_WASM_API_TOKENS allowlist. Each
        entry may carry a `:tenant=...` clause restricting the token to
        a subset of tenants; see API.md `Per-tenant scopes`. An empty
        allowlist puts the gateway in dev mode (auth disabled).

  parameters:
    FunctionId:
      name: id
      in: path
      required: true
      description: Server-assigned function identifier (UUIDv4).
      schema:
        type: string
        format: uuid
    TenantHeader:
      name: X-TensorWasm-Tenant
      in: header
      required: false
      description: |
        Tenant scope (u64). Defaults to 0 if absent. Mandatory when the
        gateway runs with `TENSOR_WASM_API_REQUIRE_TENANT=1`.
      schema:
        type: integer
        format: int64
        minimum: 0

  headers:
    XRequestId:
      description: |
        Per-request UUID stamped by the audit middleware. Operators can
        correlate audit records, structured logs, and trace events by
        this id.
      schema:
        type: string
        format: uuid
    XTraceId:
      description: |
        W3C `trace-id` (32 lowercase hex chars) of the current span.
        Empty string if no trace context is active.
      schema:
        type: string
    RetryAfter:
      description: |
        Per RFC 9110 §10.2.3, integer seconds until the next request is
        likely to succeed. Always at least 1.
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: Validation failure
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    Unauthorized:
      description: Missing or unrecognised bearer token
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    Forbidden:
      description: Bearer token is not scoped to the requested tenant
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    TenantScopeDenied:
      description: |
        The caller is not authorised to operate on the bound tenant. The
        response body always uses `kind: "tenant_scope_denied"` and the
        standard `ApiErrorEnvelope` shape. Two failure modes fold into
        this status:

        * **Token-scope mismatch.** The bearer token's `:tenant=` scope
          does not cover `X-TensorWasm-Tenant`. Checked first so an
          out-of-scope caller cannot probe id existence via a `404 vs 403`
          split.
        * **Resource-owner mismatch.** The token scope admits the bound
          tenant, but the addressed `FunctionRecord` (or `JobRecord`) is
          owned by a different tenant. This is the resource-layer check
          added by the B1.9 follow-up: without it, a wildcard-scoped
          caller from tenant B could touch tenant A's records.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    NotFound:
      description: Function or job id is unknown
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    PayloadTooLarge:
      description: |
        Request body exceeded the 64 MiB cap enforced by axum's
        `DefaultBodyLimit::max`. Often rendered as a bare 413 with no
        body when the limit is hit during streaming.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
    RateLimited:
      description: |
        Per-token QPS + burst exceeded. The `Retry-After` header carries
        the wait in integer seconds (RFC 9110 §10.2.3).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    InternalError:
      description: Underlying wasmtime or host failure
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    InvokeTimeout:
      description: Invocation exceeded its per-call deadline
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"

  schemas:
    FunctionId:
      type: string
      format: uuid
      description: Server-assigned function identifier (UUIDv4).
    JobId:
      type: string
      format: uuid
      description: Server-assigned job identifier (UUIDv4).
    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
      required: [status]
      additionalProperties: false
    CreateFunctionRequest:
      type: object
      description: |
        Body of `POST /functions`. Mirrors the
        `tensor_wasm_api::routes::CreateFunctionRequest` Rust struct.
      properties:
        name:
          type: string
          minLength: 1
          description: Tenant-supplied display name (free-form, non-empty).
        wasm_b64:
          type: string
          minLength: 12
          description: |
            Base64-encoded Wasm module bytes (standard alphabet,
            padded). Decoded value must validate as a complete Wasm
            module via `wasmparser::validate`.
      required: [name, wasm_b64]
      additionalProperties: false
    CreateFunctionResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/FunctionId"
      required: [id]
      additionalProperties: false
    FunctionRecord:
      type: object
      description: |
        Server-side record of a deployed Wasm module. Mirrors the
        `tensor_wasm_api::routes::FunctionRecord` Rust struct. The `wasm_bytes`
        field is intentionally excluded from the wire form — the gateway
        never echoes raw module bytes back. `tenant_id` records the
        owning tenant resolved from `X-TensorWasm-Tenant` at deploy time;
        invoke / delete handlers gate cross-tenant access on it (returning
        `403 tenant_scope_denied` on a mismatch).
      properties:
        id:
          $ref: "#/components/schemas/FunctionId"
        tenant_id:
          type: integer
          format: int64
          minimum: 0
          description: |
            Owning tenant (u64), set at deploy time from the
            `X-TensorWasm-Tenant` header. Defaults to 0 when the header is
            absent. Compared against the bound tenant on every invoke /
            delete; mismatch yields `403 tenant_scope_denied`.
        name:
          type: string
          minLength: 1
          description: Tenant-supplied display name, echoed back verbatim.
        created_unix_ms:
          type: integer
          format: int64
          minimum: 0
          description: Millisecond-precision Unix timestamp of deploy.
      required: [id, tenant_id, name, created_unix_ms]
      additionalProperties: false
    InvokeRequest:
      type: object
      description: |
        Wire envelope for synchronous and asynchronous invocation. Both
        fields are optional and the server tolerates empty / missing
        bodies; clients written today must use this shape so they keep
        working when api S-31 wires `args` through to the executor.
      properties:
        export:
          type: string
          description: |
            Name of the exported function to call. When omitted, the
            server falls back to its built-in `_start` → `main`
            resolution.
        args:
          type: array
          items: {}
          description: |
            Arguments forwarded to the export. Currently ignored — the
            executor only supports `() -> ()` signatures.
      additionalProperties: false
    InvokeResult:
      type: object
      properties:
        function_id:
          $ref: "#/components/schemas/FunctionId"
        result:
          type: string
          description: |
            Stable string-shaped invocation result. Will widen to the
            executor's JSON return value once that surface lands.
      required: [function_id, result]
      additionalProperties: false
    InvokeAsyncResponse:
      type: object
      properties:
        job_id:
          $ref: "#/components/schemas/JobId"
      required: [job_id]
      additionalProperties: false
    JobStatus:
      type: string
      enum: [pending, completed, failed]
      description: |
        Lifecycle state of an async invocation. `pending` jobs have no
        result yet; `completed` and `failed` jobs carry a `result`
        payload (the InvokeResult shape and the ApiErrorBody shape,
        respectively).
    JobRecord:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/JobId"
        function_id:
          $ref: "#/components/schemas/FunctionId"
        tenant_id:
          type: integer
          format: int64
          minimum: 0
          description: |
            Tenant under which the job was dispatched. `GET /jobs/{id}`
            returns `403 tenant_scope_denied` when the caller's
            `X-TensorWasm-Tenant` header does not match this value, so a
            token authorised for one tenant cannot read another tenant's
            job results.
        status:
          $ref: "#/components/schemas/JobStatus"
        result:
          description: |
            Present once `status` transitions out of `pending`. For
            `completed` jobs this is the InvokeResult JSON object;
            for `failed` jobs it is the ApiErrorBody JSON object.
        created_unix_ms:
          type: integer
          format: int64
          minimum: 0
      required: [id, function_id, tenant_id, status, created_unix_ms]
      additionalProperties: false
    ApiErrorBody:
      type: object
      properties:
        kind:
          type: string
          description: Stable machine-readable identifier.
          enum:
            - invalid_json
            - invalid_name
            - invalid_base64
            - invalid_wasm
            - missing_export
            - missing_tenant
            - invalid_tenant
            - duplicate_tenant_header
            - invalid_auth
            - unauthorized
            - tenant_scope_denied
            - not_found
            - instance_not_found
            - body_too_large
            - rate_limited
            - invoke_timeout
            - wasmtime
            - internal
        message:
          type: string
          description: Human-readable description (not part of the contract).
      required: [kind, message]
      additionalProperties: false
    ApiErrorEnvelope:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ApiErrorBody"
      required: [error]
      additionalProperties: false

    CompletionsRequest:
      type: object
      description: |
        Body of `POST /v1/completions`. Mirrors the public OpenAI
        contract documented at
        https://platform.openai.com/docs/api-reference/completions/create
        so that off-the-shelf SDKs deserialise without modification.
        Every field is optional at the wire layer; the v0.4 wiring step
        will tighten required-ness once `model` resolves to a deployed
        FunctionRecord. Mirrors `tensor_wasm_api::openai::CompletionsRequest`.
      properties:
        model:
          type: string
          description: Model identifier (resolved to a deployed function in v0.4).
        prompt:
          description: Prompt text (string) or array of strings (OpenAI batch shape).
        max_tokens:
          type: integer
          minimum: 1
        temperature:
          type: number
          minimum: 0
          maximum: 2
        stream:
          type: boolean
        echo:
          type: boolean
        n:
          type: integer
          minimum: 1
        user:
          type: string

    ChatMessage:
      type: object
      description: |
        One entry in the `messages` array of
        `POST /v1/chat/completions`. Mirrors the OpenAI message shape.
      properties:
        role:
          type: string
          description: One of `system`, `user`, `assistant`, `tool` (OpenAI shape).
        content:
          description: Message content (string or content-array for multimodal).
        name:
          type: string

    ChatCompletionsRequest:
      type: object
      description: |
        Body of `POST /v1/chat/completions`. Mirrors the public OpenAI
        contract documented at
        https://platform.openai.com/docs/api-reference/chat/create.
        Mirrors `tensor_wasm_api::openai::ChatCompletionsRequest`.
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        max_tokens:
          type: integer
          minimum: 1
        temperature:
          type: number
          minimum: 0
          maximum: 2
        stream:
          type: boolean
        n:
          type: integer
          minimum: 1
        tools:
          description: Optional tool-calling array (OpenAI tools surface; v0.4 wires).
        user:
          type: string

    OpenAiErrorBody:
      type: object
      description: |
        OpenAI-shape error body. Distinct from `ApiErrorBody` because
        OpenAI SDKs parse the four-field shape verbatim and will not
        look at the native envelope. Mirrors
        `tensor_wasm_api::openai::OpenAiErrorBody`.
      properties:
        message:
          type: string
        type:
          type: string
          description: |
            OpenAI-conventional error category. Known values include
            `not_implemented` (scaffold 501) and `invalid_request_error`
            (extractor 400). Other values may appear as the surface
            grows; clients should treat the field as an open string.
        param:
          type: ["string", "null"]
          description: Name of the offending request field, if any.
        code:
          type: ["string", "null"]
          description: |
            Stable machine-readable code that clients branch on. The
            scaffold returns `openai_not_yet_wired`; the invalid-JSON
            path returns `openai_invalid_request`.
      required: [message, type]

    OpenAiError:
      type: object
      description: |
        Top-level OpenAI-shape error envelope: `{ "error": { ... } }`.
        Returned by every error response on the `/v1/...` routes. See
        `OpenAiErrorBody` for the inner shape.
      properties:
        error:
          $ref: "#/components/schemas/OpenAiErrorBody"
      required: [error]
