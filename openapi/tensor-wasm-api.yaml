# Copyright 2026 Craton Software Company
#
# OpenAPI 3.1 description of the Craton TensorWasm HTTP API gateway.
#
# This file is the canonical machine-readable contract for the
# tensor-wasm-api router defined in crates/tensor-wasm-api/src/server.rs and
# handler set in crates/tensor-wasm-api/src/routes.rs. The
# `openapi_validation_test` integration test (under the same crate's tests/
# directory) asserts that every route registered on the live axum router
# has a corresponding `paths` entry below and that the request body schema
# for `POST /functions` round-trips a real `CreateFunctionRequest` Rust
# value. CI runs the test on every PR; see .github/workflows/ci.yml job
# `openapi`.
#
# Indentation is two spaces. Top-level keys (openapi, info, servers, …)
# sit at column 0; the `paths:` map's keys (e.g. `/healthz:`) sit at
# column 2 so the test's structural scan can pick them up. Do not
# introduce tab characters or alternative indentation widths without
# updating the parser in openapi_validation_test.rs.

openapi: 3.1.0
info:
  title: TensorWasm HTTP API
  description: |
    REST surface of a Craton TensorWasm serverless Wasm node. Prose
    documentation, error semantics, and the full middleware stack live in
    crates/tensor-wasm-api/API.md.
  version: 0.3.7
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  contact:
    name: Craton Software Company
    email: security@craton.com.ar
    url: https://github.com/craton-co/craton-tensor-wasm
servers:
  - url: http://localhost:8080
    description: Local development server
security:
  - BearerAuth: []
tags:
  - name: lifecycle
    description: Function deploy / delete
  - name: invoke
    description: Synchronous and asynchronous invocations
  - name: jobs
    description: Async-job poll API
  - name: ops
    description: Operator-facing endpoints (health, metrics)
  - name: openai-compat
    description: |
      OpenAI-compatible inference gateway (T41, v0.4). The two routes
      under this tag accept the public OpenAI REST request shapes so
      off-the-shelf SDKs (Python `openai`, Node `openai`, LangChain,
      LlamaIndex, ...) can target the gateway URL without modification.
      The handlers resolve the request's `model` field against an
      env-configured `model -> function_uuid` map
      (`TENSOR_WASM_API_OPENAI_MODEL_MAP`) and dispatch through the
      shared executor. See `docs/OPENAI-COMPAT.md` for the wire
      contract and the operator configuration knob.

paths:
  /healthz:
    get:
      tags: [ops]
      summary: Liveness probe
      operationId: healthz
      security: []
      responses:
        "200":
          description: Service is alive
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /metrics:
    get:
      tags: [ops]
      summary: Prometheus text exposition
      operationId: metrics
      responses:
        "200":
          description: Prometheus 0.0.4 text exposition
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  /functions:
    post:
      tags: [lifecycle]
      summary: Deploy a new Wasm module
      operationId: createFunction
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFunctionRequest"
      responses:
        "200":
          description: Function deployed
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateFunctionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"

  /functions/{id}:
    delete:
      tags: [lifecycle]
      summary: Delete a deployed function
      operationId: deleteFunction
      parameters:
        - $ref: "#/components/parameters/FunctionId"
        - $ref: "#/components/parameters/TenantHeader"
      responses:
        "204":
          description: Function removed
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  /functions/{id}/invoke:
    post:
      tags: [invoke]
      summary: Invoke a function synchronously
      operationId: invokeFunction
      parameters:
        - $ref: "#/components/parameters/FunctionId"
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeRequest"
      responses:
        "200":
          description: Invocation complete
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvokeResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "504":
          $ref: "#/components/responses/InvokeTimeout"

  /functions/{id}/invoke-async:
    post:
      tags: [invoke]
      summary: Invoke a function asynchronously
      operationId: invokeFunctionAsync
      parameters:
        - $ref: "#/components/parameters/FunctionId"
        - $ref: "#/components/parameters/TenantHeader"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeRequest"
      responses:
        "202":
          description: Job accepted
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvokeAsyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"

  /functions/{id}/invoke-stream:
    post:
      tags: [invoke]
      summary: Invoke a function and stream the response (SSE or chunked).
      description: |
        Streaming counterpart of `/functions/{id}/invoke`. The response
        shape is selected from the request's `Accept` header:

        * `Accept: text/event-stream` — Server-Sent Events. Each chunk
          the guest emits via the `wasi:tensor/host.emit-chunk` host
          function is rendered as one `event: chunk` frame. The stream
          terminates with an `event: done` frame on success or an
          `event: error` frame on guest failure / deadline-elapsed.
        * Otherwise — `Content-Type: application/octet-stream`,
          `Transfer-Encoding: chunked`. Each guest chunk is forwarded
          verbatim as one HTTP chunk frame, followed by the same
          terminal `event: done` / `event: error` line so clients on
          either negotiation outcome detect end-of-stream uniformly.

        ### v0.4 wiring (T34)

        The route is wired end-to-end through
        `tensor_wasm_wasi_gpu::StreamingContext`. Guest emits land on a
        `tokio::sync::mpsc::Receiver<Vec<u8>>` the gateway drains into
        the response body. The cooperative-deadline path (T36) routes
        a deadline-elapsed signal into a final `event: error` with
        `{"reason":"deadline_elapsed"}` so SSE clients can distinguish
        it from a generic trap. See `docs/STREAMING.md`.
      operationId: invokeFunctionStream
      parameters:
        - $ref: "#/components/parameters/FunctionId"
        - $ref: "#/components/parameters/TenantHeader"
        - name: Accept
          in: header
          required: false
          description: |
            Set to `text/event-stream` to receive SSE framing. Any
            other value (or absence) selects the
            `application/octet-stream` chunked-transfer branch.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              description: |
                Arbitrary JSON payload, same shape as the synchronous
                invoke endpoint. The v0.x executor ignores the value.
      responses:
        "200":
          description: |
            Streaming response. The body framing depends on the
            negotiated content type — see the operation summary.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Server-Sent Events stream. Each emitted chunk is
                  one `event: chunk` frame; the stream ends with an
                  `event: done` frame on success or an `event: error`
                  frame on failure / deadline-elapsed.
            application/octet-stream:
              schema:
                type: string
                format: binary
                description: |
                  Raw chunked-transfer bytes — one HTTP chunk per
                  guest-emitted chunk, followed by a final terminal
                  `event: done` / `event: error` line.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/completions:
    post:
      tags: [openai-compat]
      summary: OpenAI-compatible text completions (T41 wired)
      description: |
        Accepts the public OpenAI `POST /v1/completions` request shape
        and dispatches to the deployed function the gateway operator
        has aliased to the requested `model` (via
        `TENSOR_WASM_API_OPENAI_MODEL_MAP`). Returns the standard OpenAI
        `text_completion` envelope on success, or
        `404 model_not_found` when the model alias is unknown.

        When `stream: true`, returns `text/event-stream` with one
        `data: { ... }` SSE frame per emitted chunk and a terminal
        `data: [DONE]\n\n` line.

        The `X-TensorWasm-Tenant` header is not honoured on this
        route, because OpenAI SDKs never send it. Tenant resolution
        comes from the bearer token's scope (see
        `docs/OPENAI-COMPAT.md`).
      operationId: openaiCompletions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionsRequest"
      responses:
        "200":
          description: Completion result (or SSE stream when `stream:true`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionsResponse"
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE stream. Each guest chunk lands as one `data: { ... }`
                  frame whose JSON carries the OpenAI delta shape; the
                  stream terminates with a literal `data: [DONE]\n\n` line.
        "400":
          description: Malformed request body (OpenAI envelope).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            The requested `model` is not configured in the gateway's
            `TENSOR_WASM_API_OPENAI_MODEL_MAP`. Carries OpenAI envelope
            `code: "model_not_found"`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"

  /v1/chat/completions:
    post:
      tags: [openai-compat]
      summary: OpenAI-compatible chat completions (T41 wired)
      description: |
        Accepts the public OpenAI `POST /v1/chat/completions` request
        shape (system / user / assistant `messages` array) and
        dispatches to the function the operator has aliased to the
        requested `model`. The `messages` array is concatenated into a
        single role-tagged prompt string before dispatch (`system:
        ...\nuser: ...\nassistant:`).

        Returns the standard OpenAI `chat.completion` envelope on
        success, or `404 model_not_found` when the alias is unknown.
        Streaming framing matches `/v1/completions`, except the JSON
        delta uses the chat shape (`choices[0].delta.content`) and the
        object kind is `chat.completion.chunk`.
      operationId: openaiChatCompletions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionsRequest"
      responses:
        "200":
          description: Chat completion (or SSE stream when `stream:true`).
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionsResponse"
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE stream. Each guest chunk lands as one `data: { ... }`
                  frame whose JSON carries the OpenAI chat delta shape; the
                  stream terminates with a literal `data: [DONE]\n\n` line.
        "400":
          description: Malformed request body (OpenAI envelope).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAiError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: |
            The requested `model` is not configured in the gateway's
            `TENSOR_WASM_API_OPENAI_MODEL_MAP`. Carries OpenAI envelope
            `code: "model_not_found"`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenAiError"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/RateLimited"

  /jobs/{id}:
    get:
      tags: [jobs]
      summary: Poll an async-invocation job
      operationId: getJob
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current job status
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            X-Trace-Id:
              $ref: "#/components/headers/XTraceId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Bearer token from the TENSOR_WASM_API_TOKENS allowlist. Each
        entry may carry a `:tenant=...` clause restricting the token to
        a subset of tenants; see API.md `Per-tenant scopes`. An empty
        allowlist puts the gateway in dev mode (auth disabled).

  parameters:
    FunctionId:
      name: id
      in: path
      required: true
      description: Server-assigned function identifier (UUIDv4).
      schema:
        type: string
        format: uuid
    TenantHeader:
      name: X-TensorWasm-Tenant
      in: header
      required: false
      description: |
        Tenant scope (u64). Defaults to 0 if absent. Mandatory when the
        gateway runs with `TENSOR_WASM_API_REQUIRE_TENANT=1`.
      schema:
        type: integer
        format: int64
        minimum: 0

  headers:
    XRequestId:
      description: |
        Per-request UUID stamped by the audit middleware. Operators can
        correlate audit records, structured logs, and trace events by
        this id.
      schema:
        type: string
        format: uuid
    XTraceId:
      description: |
        W3C `trace-id` (32 lowercase hex chars) of the current span.
        Empty string if no trace context is active.
      schema:
        type: string
    RetryAfter:
      description: |
        Per RFC 9110 §10.2.3, integer seconds until the next request is
        likely to succeed. Always at least 1.
      schema:
        type: integer
        minimum: 1

  responses:
    BadRequest:
      description: Validation failure
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    Unauthorized:
      description: Missing or unrecognised bearer token
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    Forbidden:
      description: Bearer token is not scoped to the requested tenant
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    NotFound:
      description: Function or job id is unknown
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    PayloadTooLarge:
      description: |
        Request body exceeded the 64 MiB cap enforced by axum's
        `DefaultBodyLimit::max`. Often rendered as a bare 413 with no
        body when the limit is hit during streaming.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
    RateLimited:
      description: |
        Per-token QPS + burst exceeded. The `Retry-After` header carries
        the wait in integer seconds (RFC 9110 §10.2.3).
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    InternalError:
      description: Underlying wasmtime or host failure
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    InvokeTimeout:
      description: Invocation exceeded its per-call deadline
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        X-Trace-Id:
          $ref: "#/components/headers/XTraceId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"

  schemas:
    FunctionId:
      type: string
      format: uuid
      description: Server-assigned function identifier (UUIDv4).
    JobId:
      type: string
      format: uuid
      description: Server-assigned job identifier (UUIDv4).
    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok]
      required: [status]
      additionalProperties: false
    CreateFunctionRequest:
      type: object
      description: |
        Body of `POST /functions`. Mirrors the
        `tensor_wasm_api::routes::CreateFunctionRequest` Rust struct.
      properties:
        name:
          type: string
          minLength: 1
          description: Tenant-supplied display name (free-form, non-empty).
        wasm_b64:
          type: string
          minLength: 12
          description: |
            Base64-encoded Wasm module bytes (standard alphabet,
            padded). Decoded value must validate as a complete Wasm
            module via `wasmparser::validate`.
      required: [name, wasm_b64]
      additionalProperties: false
    CreateFunctionResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/FunctionId"
      required: [id]
      additionalProperties: false
    InvokeRequest:
      type: object
      description: |
        Body of POST /functions/{id}/invoke (and the async sibling).
        Both fields are optional — an empty body or `{}` is the canonical
        no-args case, matching the pre-args wire contract. Unknown
        top-level fields are ignored for forward compatibility; malformed
        JSON surfaces as 400 invalid_json.
      properties:
        export:
          type: string
          nullable: true
          description: |
            Optional export-name override. When omitted (or null), the
            server tries `_start` first and falls back to `main`, matching
            the WASI command convention.
        args:
          type: array
          default: []
          description: |
            Argument list forwarded to the executor's `call_export_with_args`
            path. Each element is converted to the closest-fitting wasm value
            type: integers in [-2^31, 2^31) become i32, larger integers become
            i64, non-integer numerics become f64. Strings / arrays / null /
            booleans are rejected as 400 invalid_args. f32 cannot be selected
            from JSON unambiguously — write a guest wrapper that demotes from
            f64 if you need it.
          items:
            oneOf:
              - type: integer
                format: int64
              - type: number
                format: double
      additionalProperties: false
    InvokeResult:
      type: object
      properties:
        function_id:
          $ref: "#/components/schemas/FunctionId"
        result:
          description: |
            Invocation result. For exports returning `()` this collapses
            to the literal string `"ok"` (legacy back-compat envelope).
            For exports with a non-empty result list this is a JSON
            array of return values — one element per wasm result slot,
            with i32/i64 rendered as JSON integers and f32/f64 as JSON
            numbers.
      required: [function_id, result]
      additionalProperties: false
    InvokeAsyncResponse:
      type: object
      properties:
        job_id:
          $ref: "#/components/schemas/JobId"
      required: [job_id]
      additionalProperties: false
    JobStatus:
      type: string
      enum: [pending, completed, failed]
      description: |
        Lifecycle state of an async invocation. `pending` jobs have no
        result yet; `completed` and `failed` jobs carry a `result`
        payload (the InvokeResult shape and the ApiErrorBody shape,
        respectively).
    JobRecord:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/JobId"
        function_id:
          $ref: "#/components/schemas/FunctionId"
        status:
          $ref: "#/components/schemas/JobStatus"
        result:
          description: |
            Present once `status` transitions out of `pending`. For
            `completed` jobs this is the InvokeResult JSON object;
            for `failed` jobs it is the ApiErrorBody JSON object.
        created_unix_ms:
          type: integer
          format: int64
          minimum: 0
      required: [id, function_id, status, created_unix_ms]
      additionalProperties: false
    ApiErrorBody:
      type: object
      properties:
        kind:
          type: string
          description: Stable machine-readable identifier.
          enum:
            - invalid_json
            - invalid_name
            - invalid_base64
            - invalid_wasm
            - invalid_args
            - missing_export
            - missing_tenant
            - unauthorized
            - tenant_scope_denied
            - not_found
            - instance_not_found
            - body_too_large
            - rate_limited
            - invoke_timeout
            - wasmtime
            - internal
        message:
          type: string
          description: Human-readable description (not part of the contract).
      required: [kind, message]
      additionalProperties: false
    ApiErrorEnvelope:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/ApiErrorBody"
      required: [error]
      additionalProperties: false

    # ---- OpenAI-compatible request / response shapes (T41) ---------------
    CompletionsRequest:
      type: object
      description: |
        Body of `POST /v1/completions`. Mirrors the public OpenAI
        completions REST contract; every field is optional at the wire
        layer so SDKs that omit knobs still parse cleanly.
      properties:
        model:
          type: string
          description: |
            Model identifier. The gateway operator pre-aliases this to
            a deployed function UUID via
            `TENSOR_WASM_API_OPENAI_MODEL_MAP`. Unknown ids surface as
            `404 model_not_found`.
        prompt:
          description: |
            Prompt text. Accepts either a single string or an array of
            strings; arrays are joined with newlines before dispatch.
        max_tokens:
          type: integer
          minimum: 1
        temperature:
          type: number
        stream:
          type: boolean
          description: |
            When true the response is `text/event-stream` with one
            `data: { ... }` SSE frame per emitted chunk and a terminal
            `data: [DONE]\n\n` line.
        echo:
          type: boolean
        n:
          type: integer
          minimum: 1
        user:
          type: string
      additionalProperties: true
    ChatMessage:
      type: object
      description: One entry in the `messages` array of `POST /v1/chat/completions`.
      properties:
        role:
          type: string
          description: One of `system`, `user`, `assistant`, `tool`.
        content:
          description: |
            Message content. Either a plain string or an array of
            content parts (multimodal). For v0.4 only text parts are
            consumed; image / audio parts are silently dropped.
        name:
          type: string
      additionalProperties: true
    ChatCompletionsRequest:
      type: object
      description: |
        Body of `POST /v1/chat/completions`. Mirrors the public OpenAI
        chat-completions REST contract.
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        max_tokens:
          type: integer
          minimum: 1
        temperature:
          type: number
        stream:
          type: boolean
        n:
          type: integer
          minimum: 1
        tools:
          description: |
            OpenAI tool-calling array. Accepted on the wire for forward
            compatibility but not yet honoured; v0.5 wires.
        user:
          type: string
      additionalProperties: true
    CompletionsChoice:
      type: object
      description: |
        One entry in the `choices` array of a non-streaming
        `/v1/completions` response.
      properties:
        text:
          type: string
        index:
          type: integer
          minimum: 0
        finish_reason:
          type: string
          enum: [stop, length, content_filter, null]
          nullable: true
        logprobs:
          nullable: true
      required: [text, index]
    ChatCompletionsChoice:
      type: object
      description: |
        One entry in the `choices` array of a non-streaming
        `/v1/chat/completions` response.
      properties:
        index:
          type: integer
          minimum: 0
        message:
          type: object
          properties:
            role:
              type: string
              enum: [assistant]
            content:
              type: string
          required: [role, content]
        finish_reason:
          type: string
          enum: [stop, length, content_filter, null]
          nullable: true
      required: [index, message]
    CompletionsUsage:
      type: object
      description: |
        Token-count block. v0.4 ships zeros across the board because
        the gateway does not yet wire a tokenizer; v0.5 lands a real
        counter (see `docs/OPENAI-COMPAT.md`).
      properties:
        prompt_tokens:
          type: integer
          minimum: 0
        completion_tokens:
          type: integer
          minimum: 0
        total_tokens:
          type: integer
          minimum: 0
      required: [prompt_tokens, completion_tokens, total_tokens]
    CompletionsResponse:
      type: object
      description: |
        Non-streaming `/v1/completions` response. The `object` field
        carries the literal `"text_completion"`.
      properties:
        id:
          type: string
        object:
          type: string
          enum: [text_completion]
        created:
          type: integer
          format: int64
          description: Unix seconds at which the response was generated.
        model:
          type: string
          description: Echoes the request's `model` field.
        choices:
          type: array
          items:
            $ref: "#/components/schemas/CompletionsChoice"
        usage:
          $ref: "#/components/schemas/CompletionsUsage"
      required: [id, object, created, model, choices, usage]
    ChatCompletionsResponse:
      type: object
      description: |
        Non-streaming `/v1/chat/completions` response. The `object`
        field carries the literal `"chat.completion"`.
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
          format: int64
        model:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChatCompletionsChoice"
        usage:
          $ref: "#/components/schemas/CompletionsUsage"
      required: [id, object, created, model, choices, usage]
    OpenAiErrorBody:
      type: object
      description: |
        Inner body of the OpenAI error envelope. The four-field shape
        (`message`, `type`, `param`, `code`) is what off-the-shelf
        OpenAI SDKs parse; this is distinct from the gateway's native
        `ApiErrorBody`.
      properties:
        message:
          type: string
        type:
          type: string
          description: OpenAI-conventional error category.
        param:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
      required: [message, type]
    OpenAiError:
      type: object
      description: |
        Top-level OpenAI error envelope. `code: "model_not_found"`
        surfaces with status `404`; `code: "openai_invalid_request"`
        with `400`; `type: "server_error"` with `500`.
      properties:
        error:
          $ref: "#/components/schemas/OpenAiErrorBody"
      required: [error]
